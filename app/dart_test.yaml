on_os:
  windows:
    # This suite starts real processes and binds loopback sockets for the
    # single-instance guard. High-core Windows hosts otherwise start enough
    # suites at once to make those bounded operating-system checks contend with
    # the test runner itself, and process startup there is slow enough to expire
    # the default budget while the work is still progressing rather than stuck.
    # Scaling the default keeps relative per-test factors scaling with it.
    concurrency: 2
    timeout: 3x
