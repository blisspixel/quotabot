version: 2

# Automated update PRs are disabled to keep bot identities out of repository
# history and contributor records. Keep security alerts enabled, but disable
# automated security fixes in repository settings too: the limit below controls
# version-update PRs only. Apply selected updates on a first-party branch.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    commit-message:
      prefix: "advisory(deps)"
    labels:
      - "dependencies"
      - "advisory-only"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/collector"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:15"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    commit-message:
      prefix: "advisory(deps)"
    labels:
      - "dependencies"
      - "advisory-only"
    groups:
      collector-dart:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/app"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:30"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    commit-message:
      prefix: "advisory(deps)"
    labels:
      - "dependencies"
      - "advisory-only"
    groups:
      app-dart:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/integrations/mcp_clients"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:45"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    commit-message:
      prefix: "advisory(deps)"
    labels:
      - "dependencies"
      - "advisory-only"
    groups:
      mcp-client-npm:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/integrations/litellm"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    commit-message:
      prefix: "advisory(deps)"
    labels:
      - "dependencies"
      - "advisory-only"
    groups:
      litellm-python:
        patterns:
          - "*"
