name: Release

# Cuts a GitHub release when a v* tag is pushed, building native CLI and desktop
# archives plus matching .sha256 sidecars. The release is created as a draft and
# published only after every platform asset has been validated, attested, and
# uploaded, so `releases/latest` never points at a partial release.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; jobs widen only what they need. Actions are
# pinned to commit SHAs (version in the trailing comment) so a repointed tag
# cannot inject a compromised action into the artifact build path. Dependabot
# reports available updates; selected pins are recreated and tested on a
# first-party branch.
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows_signing_backend: ${{ steps.signing_modes.outputs.windows_signing_backend }}
      windows_subscriber_eku: ${{ steps.signing_modes.outputs.windows_subscriber_eku }}
      macos_signing_mode: ${{ steps.signing_modes.outputs.macos_signing_mode }}
      macos_developer_identity: ${{ steps.signing_modes.outputs.macos_developer_identity }}
      macos_team_id: ${{ steps.signing_modes.outputs.macos_team_id }}
      macos_notary_issuer_id: ${{ steps.signing_modes.outputs.macos_notary_issuer_id }}
      macos_notary_key_id: ${{ steps.signing_modes.outputs.macos_notary_key_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify the tagged commit is the current main tip
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse 'HEAD^{commit}')"
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if [ "$tagged_commit" != "$main_commit" ]; then
            echo 'Release tags must point to the current protected main tip.' >&2
            exit 1
          fi
      - name: Verify tag matches the source release version
        run: python tools/check_release_version.py --tag "$GITHUB_REF_NAME"
      - name: Validate explicit native signing modes
        id: signing_modes
        env:
          WINDOWS_SIGNING_BACKEND: ${{ vars.QUOTABOT_WINDOWS_SIGNING_BACKEND }}
          WINDOWS_SUBSCRIBER_EKU: ${{ vars.QUOTABOT_WINDOWS_SUBSCRIBER_EKU }}
          MACOS_SIGNING_MODE: ${{ vars.QUOTABOT_MACOS_SIGNING_MODE }}
          MACOS_DEVELOPER_IDENTITY: ${{ vars.QUOTABOT_MACOS_DEVELOPER_IDENTITY }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.QUOTABOT_MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ vars.QUOTABOT_MACOS_NOTARY_KEY_ID }}
          MACOS_TEAM_ID: ${{ vars.QUOTABOT_MACOS_TEAM_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          windows_backend = os.environ.get("WINDOWS_SIGNING_BACKEND", "")
          windows_subscriber_eku = os.environ.get("WINDOWS_SUBSCRIBER_EKU", "")
          macos_mode = os.environ.get("MACOS_SIGNING_MODE", "")
          macos_identity = os.environ.get("MACOS_DEVELOPER_IDENTITY", "")
          macos_team_id = os.environ.get("MACOS_TEAM_ID", "")
          macos_notary_issuer_id = os.environ.get("MACOS_NOTARY_ISSUER_ID", "")
          macos_notary_key_id = os.environ.get("MACOS_NOTARY_KEY_ID", "")

          if windows_backend not in {"unsigned", "azure-artifact-signing"}:
              raise SystemExit(
                  "QUOTABOT_WINDOWS_SIGNING_BACKEND must be unsigned or "
                  "azure-artifact-signing."
              )
          if windows_backend == "azure-artifact-signing":
              if (
                  re.fullmatch(
                      r"1\.3\.6\.1\.4\.1\.311\.97\.(?:0|[1-9][0-9]*)"
                      r"(?:\.(?:0|[1-9][0-9]*))*",
                      windows_subscriber_eku,
                  )
                  is None
                  or windows_subscriber_eku == "1.3.6.1.4.1.311.97.1.0"
              ):
                  raise SystemExit("QUOTABOT_WINDOWS_SUBSCRIBER_EKU is invalid.")
          else:
              windows_subscriber_eku = ""

          if macos_mode not in {"unsigned", "developer-id"}:
              raise SystemExit(
                  "QUOTABOT_MACOS_SIGNING_MODE must be unsigned or developer-id."
              )
          if macos_mode == "developer-id":
              if (
                  not macos_identity.startswith("Developer ID Application: ")
                  or len(macos_identity) > 256
                  or any(ord(character) < 32 or ord(character) == 127 for character in macos_identity)
              ):
                  raise SystemExit("QUOTABOT_MACOS_DEVELOPER_IDENTITY is invalid.")
              if re.fullmatch(r"[A-Z0-9]{10}", macos_team_id) is None:
                  raise SystemExit("QUOTABOT_MACOS_TEAM_ID is invalid.")
              if not macos_identity.endswith(f" ({macos_team_id})"):
                  raise SystemExit(
                      "The macOS Developer ID identity does not match its team id."
                  )
              if (
                  re.fullmatch(
                      r"[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-"
                      r"[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}",
                      macos_notary_issuer_id,
                  )
                  is None
              ):
                  raise SystemExit("QUOTABOT_MACOS_NOTARY_ISSUER_ID is invalid.")
              if re.fullmatch(r"[A-Z0-9]{10}", macos_notary_key_id) is None:
                  raise SystemExit("QUOTABOT_MACOS_NOTARY_KEY_ID is invalid.")
          else:
              macos_identity = ""
              macos_team_id = ""
              macos_notary_issuer_id = ""
              macos_notary_key_id = ""

          outputs = {
              "windows_signing_backend": windows_backend,
              "windows_subscriber_eku": windows_subscriber_eku,
              "macos_signing_mode": macos_mode,
              "macos_developer_identity": macos_identity,
              "macos_team_id": macos_team_id,
              "macos_notary_issuer_id": macos_notary_issuer_id,
              "macos_notary_key_id": macos_notary_key_id,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
          PY

  quality-gate:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  codeql-gate:
    needs: preflight
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  secret-scan-gate:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/gitleaks.yml

  create-release:
    needs:
      - preflight
      - quality-gate
      - codeql-gate
      - secret-scan-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.ensure_release.outputs.release_id }}
      release_title_sha256: ${{ steps.ensure_release.outputs.release_title_sha256 }}
      release_body_sha256: ${{ steps.ensure_release.outputs.release_body_sha256 }}
      windows_signing_backend: ${{ steps.ensure_release.outputs.windows_signing_backend }}
      windows_subscriber_eku: ${{ steps.ensure_release.outputs.windows_subscriber_eku }}
      macos_signing_mode: ${{ steps.ensure_release.outputs.macos_signing_mode }}
      macos_developer_identity: ${{ steps.ensure_release.outputs.macos_developer_identity }}
      macos_team_id: ${{ steps.ensure_release.outputs.macos_team_id }}
      macos_notary_issuer_id: ${{ steps.ensure_release.outputs.macos_notary_issuer_id }}
      macos_notary_key_id: ${{ steps.ensure_release.outputs.macos_notary_key_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create the release as a draft if it does not exist
        id: ensure_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_SIGNING_BACKEND: ${{ needs.preflight.outputs.windows_signing_backend }}
          WINDOWS_SUBSCRIBER_EKU: ${{ needs.preflight.outputs.windows_subscriber_eku }}
          MACOS_SIGNING_MODE: ${{ needs.preflight.outputs.macos_signing_mode }}
          MACOS_DEVELOPER_IDENTITY: ${{ needs.preflight.outputs.macos_developer_identity }}
          MACOS_TEAM_ID: ${{ needs.preflight.outputs.macos_team_id }}
          MACOS_NOTARY_ISSUER_ID: ${{ needs.preflight.outputs.macos_notary_issuer_id }}
          MACOS_NOTARY_KEY_ID: ${{ needs.preflight.outputs.macos_notary_key_id }}
        run: |
          resolve_remote_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq '[.object.type, .object.sha] | @tsv')
            for _ in 1 2 3 4 5 6 7 8; do
              case "$object_type" in
                commit)
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  read -r object_type object_sha < <(gh api \
                    "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                    --jq '[.object.type, .object.sha] | @tsv')
                  ;;
                *)
                  echo "Release tag resolves to unsupported object type: $object_type" >&2
                  return 1
                  ;;
              esac
            done
            echo 'Release tag indirection is unexpectedly deep.' >&2
            return 1
          }

          expected_prerelease=false
          prerelease_args=()
          case "$GITHUB_REF_NAME" in
            *-*) expected_prerelease=true; prerelease_args+=(--prerelease --latest=false) ;;
          esac
          if [ "$WINDOWS_SIGNING_BACKEND" = azure-artifact-signing ]; then
            windows_status='Windows: Azure Artifact Signing Public Trust with RFC 3161 SHA-256 timestamping.'
          else
            windows_status='Windows: unsigned transition artifact. SmartScreen publisher identity is not established.'
          fi
          if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            macos_status='macOS: Developer ID signed, hardened, notarized, stapled where supported, and Gatekeeper verified.'
          else
            macos_status='macOS: unsigned transition artifact. Developer ID and notarization are not established.'
          fi
          signing_note="Native signing status: $windows_status $macos_status Checksums and GitHub build provenance remain required. Do not bypass SmartScreen or Gatekeeper."
          release_version="${GITHUB_REF_NAME#v}"
          changelog_notes="$(awk -v version="$release_version" '
            index($0, "## " version " - ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$changelog_notes" ]; then
            echo "CHANGELOG.md has no release section for $release_version." >&2
            exit 1
          fi
          release_notes="$(printf '%s\n\n%s\n' "$signing_note" "$changelog_notes")"
          main_commit="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/main" \
            --jq '.sha')"
          if [ "$GITHUB_SHA" != "$main_commit" ]; then
            echo 'Releases must target the current protected main tip.' >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            read -r is_draft is_prerelease < <(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv')
            if [ "$is_draft" != true ]; then
              echo "Refusing to replace assets on published release $GITHUB_REF_NAME." >&2
              exit 1
            fi
            if [ "$is_prerelease" != "$expected_prerelease" ]; then
              echo "Draft prerelease classification does not match $GITHUB_REF_NAME." >&2
              exit 1
            fi
            remote_tag_commit="$(resolve_remote_tag_commit)"
            if [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
              echo 'Remote release tag no longer points to the workflow commit.' >&2
              exit 1
            fi
            echo "Resuming draft release $GITHUB_REF_NAME."
          else
            remote_tag_commit="$(resolve_remote_tag_commit)"
            if [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
              echo 'Remote release tag no longer points to the workflow commit.' >&2
              exit 1
            fi
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              "${prerelease_args[@]}" \
              --notes "$release_notes"
          fi
          release_id="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId \
            --jq '.databaseId')"
          case "$release_id" in
            ''|*[!0-9]*) echo 'Draft release id is invalid.' >&2; exit 1 ;;
          esac
          release_metadata="$RUNNER_TEMP/quotabot-release-metadata.json"
          expected_release_title="$RUNNER_TEMP/quotabot-expected-release-title.txt"
          expected_release_body="$RUNNER_TEMP/quotabot-expected-release-body.txt"
          actual_release_title="$RUNNER_TEMP/quotabot-actual-release-title.txt"
          actual_release_body="$RUNNER_TEMP/quotabot-actual-release-body.txt"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_metadata"
          printf '%s' "$GITHUB_REF_NAME" > "$expected_release_title"
          printf '%s' "$release_notes" > "$expected_release_body"
          jq -erj '.name | strings' "$release_metadata" > "$actual_release_title"
          jq -erj '.body | strings' "$release_metadata" > "$actual_release_body"
          if ! cmp -s "$actual_release_title" "$expected_release_title"; then
            echo 'Draft release title does not match the release tag.' >&2
            exit 1
          fi
          if ! cmp -s "$actual_release_body" "$expected_release_body"; then
            echo 'Draft release body does not exactly match the current signing policy and changelog.' >&2
            exit 1
          fi
          release_title_sha256="$(sha256sum "$actual_release_title" | awk '{print $1}')"
          release_body_sha256="$(sha256sum "$actual_release_body" | awk '{print $1}')"
          if [[ ! "$release_title_sha256" =~ ^[0-9a-f]{64}$ ]] || \
             [[ ! "$release_body_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Draft release metadata digest is invalid.' >&2
            exit 1
          fi
          {
            echo "release_id=$release_id"
            echo "release_title_sha256=$release_title_sha256"
            echo "release_body_sha256=$release_body_sha256"
            echo "windows_signing_backend=$WINDOWS_SIGNING_BACKEND"
            echo "windows_subscriber_eku=$WINDOWS_SUBSCRIBER_EKU"
            echo "macos_signing_mode=$MACOS_SIGNING_MODE"
            echo "macos_developer_identity=$MACOS_DEVELOPER_IDENTITY"
            echo "macos_team_id=$MACOS_TEAM_ID"
            echo "macos_notary_issuer_id=$MACOS_NOTARY_ISSUER_ID"
            echo "macos_notary_key_id=$MACOS_NOTARY_KEY_ID"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # macOS is Apple Silicon only: GitHub retired the Intel (macos-13)
        # runner, and Dart compiles for the host arch, so Intel Macs build from
        # source (install.sh says so). Re-add an Intel leg only if a hosted Intel
        # runner returns or we add a Rosetta x64 cross-build.
        include:
          - os: ubuntu-latest
            script: bash tools/package-cli.sh
            archive: release/quotabot-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            script: bash tools/package-cli.sh
            archive: release/quotabot-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # upload the asset to the release
      id-token: write # mint the provenance signing certificate
      attestations: write # record the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.12.2'
      - name: Resolve collector dependencies
        working-directory: collector
        run: dart pub get --enforce-lockfile
      - name: Build and package the CLI asset
        run: ${{ matrix.script }}
      - name: Verify CLI archive shape and checksum
        run: python tools/verify_cli_archive.py "${{ matrix.archive }}"
      - name: Attest build provenance for the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}
      - name: Upload the asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ matrix.archive }}" \
            "${{ matrix.archive }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build-macos-cli-unsigned:
    needs: create-release
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the pinned Apple toolchain
        run: bash tools/require-macos-toolchain.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.12.2'
      - name: Resolve collector dependencies
        working-directory: collector
        run: dart pub get --enforce-lockfile
      - name: Build and inventory the unsigned macOS CLI candidate
        run: |
          set -euo pipefail
          bash tools/package-cli.sh --no-archive
          source='collector/build/quotabot_cli_release/bundle'
          stage="$RUNNER_TEMP/quotabot-macos-cli-unsigned"
          candidate="$stage/candidate"
          mkdir -p "$stage"
          ditto "$source" "$candidate"
          python tools/native_code_inventory.py \
            --platform macos --surface cli --architecture arm64 --json \
            "$candidate" > "$stage/unsigned-inventory.json"
          python tools/create_macos_signing_plan.py \
            --manifest "$stage/unsigned-inventory.json" \
            --output "$stage/signing-plan.json" \
            --surface cli --architecture arm64 "$candidate"
          ditto -c -k --sequesterRsrc --keepParent \
            "$candidate" "$stage/candidate.zip"
          rm -rf "$candidate"
      - name: Preserve the immutable unsigned macOS CLI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-macos-cli-unsigned
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  sign-macos-cli:
    needs: [create-release, build-macos-cli-unsigned]
    if: needs.create-release.outputs.macos_signing_mode == 'developer-id'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    environment: release-signing-macos
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the pinned Apple toolchain
        run: bash tools/require-macos-toolchain.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the immutable unsigned macOS CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-macos-cli-signing
      - name: Validate, sign, notarize, and verify the macOS CLI candidate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.QUOTABOT_MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.QUOTABOT_MACOS_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_IDENTITY: ${{ needs.create-release.outputs.macos_developer_identity }}
          MACOS_NOTARY_ISSUER_ID: ${{ needs.create-release.outputs.macos_notary_issuer_id }}
          MACOS_NOTARY_KEY_ID: ${{ needs.create-release.outputs.macos_notary_key_id }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.QUOTABOT_MACOS_NOTARY_KEY_P8 }}
          MACOS_TEAM_ID: ${{ needs.create-release.outputs.macos_team_id }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/quotabot-macos-cli-signing"
          candidate="$stage/candidate"
          unsigned_manifest="$stage/unsigned-inventory.json"
          plan="$stage/signing-plan.json"
          validated_plan="$stage/validated-signing-plan.json"
          keychain="$RUNNER_TEMP/quotabot-cli-signing.keychain-db"
          certificate="$stage/developer-id.p12"
          notary_key="$stage/notary-key.p8"
          submission="$stage/notary-submission.zip"
          submission_check="$stage/notary-submission-expanded"
          submission_json="$stage/notary-submission.json"
          notary_log="$stage/notary-log.json"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$submission_check"
            rm -f "$certificate" "$notary_key" "$submission" \
              "$submission_json" "$notary_log"
          }
          trap cleanup EXIT

          [[ -f "$stage/candidate.zip" ]] || {
            echo 'The immutable macOS CLI handoff archive is missing.' >&2
            exit 1
          }
          ditto -x -k "$stage/candidate.zip" "$stage"
          rm -f "$stage/candidate.zip"

          [[ -n "$MACOS_CERTIFICATE_P12_BASE64" && \
             -n "$MACOS_CERTIFICATE_PASSWORD" && \
             -n "$MACOS_DEVELOPER_IDENTITY" && \
             -n "$MACOS_NOTARY_ISSUER_ID" && \
             -n "$MACOS_NOTARY_KEY_ID" && \
             -n "$MACOS_NOTARY_KEY_P8" && \
             -n "$MACOS_TEAM_ID" ]] || {
            echo 'The protected macOS signing environment is incomplete.' >&2
            exit 1
          }
          python tools/native_code_inventory.py \
            --platform macos --surface cli --architecture arm64 \
            --expect-manifest "$unsigned_manifest" "$candidate"
          python tools/create_macos_signing_plan.py \
            --manifest "$unsigned_manifest" --output "$validated_plan" \
            --surface cli --architecture arm64 "$candidate"
          cmp -s "$plan" "$validated_plan" || {
            echo 'The downloaded macOS CLI signing plan changed.' >&2
            exit 1
          }

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" \
            | openssl base64 -d -A -out "$certificate"
          printf '%s' "$MACOS_NOTARY_KEY_P8" > "$notary_key"
          [[ -s "$certificate" && $(stat -f '%z' "$certificate") -le 262144 ]]
          [[ -s "$notary_key" && $(stat -f '%z' "$notary_key") -le 16384 ]]
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null

          python tools/sign_macos_candidate.py \
            --manifest "$unsigned_manifest" --plan "$plan" \
            --identity "$MACOS_DEVELOPER_IDENTITY" --team-id "$MACOS_TEAM_ID" \
            --keychain "$keychain" --receipt "$stage/signing.json" "$candidate"
          python tools/native_code_inventory.py \
            --platform macos --surface cli --architecture arm64 --json \
            "$candidate" > "$stage/signed-inventory.json"
          python tools/validate_macos_signing_delta.py \
            --before "$unsigned_manifest" --after "$stage/signed-inventory.json" \
            --plan "$plan" --operation signing \
            --receipt "$stage/signing-delta.json"
          ditto -c -k --sequesterRsrc --keepParent "$candidate" "$submission"
          mkdir "$submission_check"
          ditto -x -k "$submission" "$submission_check"
          python tools/native_code_inventory.py \
            --platform macos --surface cli --architecture arm64 \
            --expect-manifest "$stage/signed-inventory.json" \
            "$submission_check/candidate"
          python tools/native_code_inventory.py \
            --platform macos --surface cli --architecture arm64 --json \
            "$submission_check/candidate" > "$stage/submission-inventory.json"
          rm -rf "$submission_check"
          if ! xcrun notarytool submit "$submission" --wait --output-format json \
            --key "$notary_key" --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" > "$submission_json"; then
            echo 'Apple did not accept the macOS CLI notarization request.' >&2
            exit 1
          fi
          submission_id="$(plutil -extract id raw -o - "$submission_json")"
          [[ "$submission_id" =~ ^[0-9A-Fa-f-]{36}$ ]] || {
            echo 'Apple returned an invalid notarization submission id.' >&2
            exit 1
          }
          xcrun notarytool log "$submission_id" --output-format json \
            --key "$notary_key" --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" > "$notary_log"
          python tools/record_macos_notarization.py \
            --submission "$submission_json" --log "$notary_log" \
            --artifact "$submission" --inventory "$stage/submission-inventory.json" \
            --signing-receipt "$stage/signing.json" \
            --surface cli --receipt "$stage/notarization.json"
          cp "$stage/signed-inventory.json" "$stage/inventory.json"
          python tools/verify_macos_signatures.py \
            --manifest "$stage/inventory.json" \
            --signing-plan "$plan" \
            --notarization-receipt "$stage/notarization.json" \
            --surface cli --architecture arm64 \
            --expected-identity "$MACOS_DEVELOPER_IDENTITY" \
            --expected-team-id "$MACOS_TEAM_ID" \
            --receipt "$stage/signature-verification.json" "$candidate"
          ditto -c -k --sequesterRsrc --keepParent \
            "$candidate" "$stage/candidate.zip"
          rm -rf "$candidate"
          cleanup
          trap - EXIT
      - name: Preserve the immutable signed macOS CLI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-cli-signed-candidate
          path: ${{ runner.temp }}/quotabot-macos-cli-signing
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  package-macos-cli:
    needs: [create-release, build-macos-cli-unsigned, sign-macos-cli]
    if: >-
      ${{ always() &&
          needs.create-release.result == 'success' &&
          needs.build-macos-cli-unsigned.result == 'success' &&
          ((needs.create-release.outputs.macos_signing_mode == 'unsigned' &&
            needs.sign-macos-cli.result == 'skipped') ||
           (needs.create-release.outputs.macos_signing_mode == 'developer-id' &&
            needs.sign-macos-cli.result == 'success')) }}
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the pinned Apple toolchain
        run: bash tools/require-macos-toolchain.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the signed macOS CLI candidate
        if: needs.create-release.outputs.macos_signing_mode == 'developer-id'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-cli-signed-candidate
          path: ${{ runner.temp }}/quotabot-macos-cli-package
      - name: Download the explicitly unsigned macOS CLI candidate
        if: needs.create-release.outputs.macos_signing_mode == 'unsigned'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-macos-cli-package
      - name: Revalidate and package the selected macOS CLI candidate
        env:
          MACOS_DEVELOPER_IDENTITY: ${{ needs.create-release.outputs.macos_developer_identity }}
          MACOS_SIGNING_MODE: ${{ needs.create-release.outputs.macos_signing_mode }}
          MACOS_TEAM_ID: ${{ needs.create-release.outputs.macos_team_id }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/quotabot-macos-cli-package"
          candidate="$stage/candidate"
          [[ -f "$stage/candidate.zip" ]] || {
            echo 'The selected macOS CLI handoff archive is missing.' >&2
            exit 1
          }
          ditto -x -k "$stage/candidate.zip" "$stage"
          rm -f "$stage/candidate.zip"
          if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            manifest="$stage/inventory.json"
          else
            manifest="$stage/unsigned-inventory.json"
          fi
          python tools/native_code_inventory.py \
            --platform macos --surface cli --architecture arm64 \
            --expect-manifest "$manifest" "$candidate"
          if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            python tools/verify_macos_signatures.py \
              --manifest "$manifest" \
              --signing-plan "$stage/signing-plan.json" \
              --notarization-receipt "$stage/notarization.json" \
              --surface cli --architecture arm64 \
              --expected-identity "$MACOS_DEVELOPER_IDENTITY" \
              --expected-team-id "$MACOS_TEAM_ID" \
              --receipt "$stage/packaging-signature-verification.json" \
              "$candidate"
          fi
          destination='collector/build/quotabot_cli_release/bundle'
          mkdir -p "$(dirname "$destination")"
          [[ ! -e "$destination" ]] || {
            echo 'Package destination unexpectedly exists.' >&2
            exit 1
          }
          ditto "$candidate" "$destination"
          bash tools/package-cli.sh --package-only
      - name: Verify and bind the macOS CLI archive
        env:
          MACOS_SIGNING_MODE: ${{ needs.create-release.outputs.macos_signing_mode }}
        run: |
          set -euo pipefail
          python tools/verify_cli_archive.py release/quotabot-darwin-arm64.tar.gz
          stage="$RUNNER_TEMP/quotabot-macos-cli-package"
          if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            manifest="$stage/inventory.json"
          else
            manifest="$stage/unsigned-inventory.json"
          fi
          expanded="$RUNNER_TEMP/quotabot-macos-cli-expanded"
          mkdir -p "$expanded"
          tar -xzf release/quotabot-darwin-arm64.tar.gz -C "$expanded"
          python tools/native_code_inventory.py \
            --platform macos --surface cli --architecture arm64 \
            --expect-manifest "$manifest" "$expanded"
      - name: Preserve the macOS CLI signing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-cli-native-signing-inventory
          path: ${{ runner.temp }}/quotabot-macos-cli-package/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Attest macOS CLI archive build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/quotabot-darwin-arm64.tar.gz
      - name: Upload the macOS CLI asset to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/quotabot-darwin-arm64.tar.gz \
            release/quotabot-darwin-arm64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  build-windows-cli-unsigned:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.12.2'
      - name: Resolve collector dependencies
        working-directory: collector
        run: dart pub get --enforce-lockfile
      - name: Build and inventory the unsigned Windows CLI candidate
        shell: pwsh
        run: |
          ./tools/package-cli.ps1 -NoArchive
          $source = 'collector/build/quotabot_cli_release/bundle'
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-unsigned'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'unsigned-inventory.json'
          $catalog = Join-Path $stage 'signing-catalog.txt'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $source -Destination $candidate -Recurse
          $inventory = python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --json $candidate
          if ($LASTEXITCODE -ne 0) { throw "Unsigned native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          python tools/create_windows_signing_catalog.py --manifest $manifest --output $catalog --surface cli --architecture x64 $candidate
          if ($LASTEXITCODE -ne 0) { throw "Signing catalog creation failed with exit code $LASTEXITCODE" }
      - name: Preserve the immutable unsigned Windows CLI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-unsigned
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  sign-windows-cli:
    needs: [create-release, build-windows-cli-unsigned]
    if: needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
    runs-on: windows-latest
    environment: release-signing
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the immutable unsigned Windows CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-signing
      - name: Validate the complete candidate and exact signing catalog
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-signing'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'unsigned-inventory.json'
          $catalog = Join-Path $stage 'signing-catalog.txt'
          $validatedCatalog = Join-Path $stage 'validated-signing-catalog.txt'
          python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --expect-manifest $manifest $candidate
          if ($LASTEXITCODE -ne 0) { throw "Unsigned candidate validation failed with exit code $LASTEXITCODE" }
          python tools/create_windows_signing_catalog.py --manifest $manifest --output $validatedCatalog --surface cli --architecture x64 $candidate
          if ($LASTEXITCODE -ne 0) { throw "Signing catalog validation failed with exit code $LASTEXITCODE" }
          $expectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $catalog).Hash
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $validatedCatalog).Hash
          if ($actualHash -ne $expectedHash) { throw 'Downloaded signing catalog does not match the validated candidate.' }
      - name: Authenticate the isolated signer to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.QUOTABOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.QUOTABOT_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.QUOTABOT_AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL
      - name: Sign the exact Windows CLI catalog with Azure Artifact Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.QUOTABOT_AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.QUOTABOT_AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.QUOTABOT_AZURE_CERTIFICATE_PROFILE }}
          files-catalog: ${{ runner.temp }}\quotabot-windows-cli-signing\validated-signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: false
          enhanced-key-usage: 1.3.6.1.5.5.7.3.3
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          timeout: 300
          batch-size: 0
          cache-dependencies: false
          trace: false
      - name: Redownload the pristine unsigned Windows CLI baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-signing-baseline
      - name: Verify the signed Windows CLI candidate
        shell: pwsh
        env:
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ needs.create-release.outputs.windows_subscriber_eku }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-signing'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'inventory.json'
          $receipt = Join-Path $stage 'signature-verification.json'
          $deltaReceipt = Join-Path $stage 'signing-delta.json'
          $baselineStage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-signing-baseline'
          $baselineCandidate = Join-Path $baselineStage 'candidate'
          $baselineManifest = Join-Path $baselineStage 'unsigned-inventory.json'
          $baselineCatalog = Join-Path $baselineStage 'signing-catalog.txt'
          $validatedBaselineCatalog = Join-Path $baselineStage 'validated-signing-catalog.txt'
          python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --expect-manifest $baselineManifest $baselineCandidate
          if ($LASTEXITCODE -ne 0) { throw "Pristine unsigned baseline validation failed with exit code $LASTEXITCODE" }
          python tools/create_windows_signing_catalog.py --manifest $baselineManifest --output $validatedBaselineCatalog --surface cli --architecture x64 $baselineCandidate
          if ($LASTEXITCODE -ne 0) { throw "Pristine signing catalog validation failed with exit code $LASTEXITCODE" }
          $expectedCatalogHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $baselineCatalog).Hash
          $actualCatalogHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $validatedBaselineCatalog).Hash
          if ($actualCatalogHash -ne $expectedCatalogHash) { throw 'Pristine signing catalog does not match the unsigned baseline.' }
          $inventory = python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --json $candidate
          if ($LASTEXITCODE -ne 0) { throw "Post-signing native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          python tools/validate_windows_signing_delta.py --before $baselineManifest --after $manifest --catalog $validatedBaselineCatalog --before-root $baselineCandidate --after-root $candidate --receipt $deltaReceipt
          if ($LASTEXITCODE -ne 0) { throw "Windows signing delta validation failed with exit code $LASTEXITCODE" }
          python tools/verify_windows_signatures.py --manifest $manifest --surface cli --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $candidate
          if ($LASTEXITCODE -ne 0) { throw "Windows signature verification failed with exit code $LASTEXITCODE" }
      - name: Preserve the immutable signed Windows CLI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cli-signed-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-signing
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  package-windows-cli:
    needs: [create-release, build-windows-cli-unsigned, sign-windows-cli]
    if: >-
      ${{ always() &&
          needs.create-release.result == 'success' &&
          needs.build-windows-cli-unsigned.result == 'success' &&
          ((needs.create-release.outputs.windows_signing_backend == 'unsigned' &&
            needs.sign-windows-cli.result == 'skipped') ||
           (needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing' &&
            needs.sign-windows-cli.result == 'success')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the signed Windows CLI candidate
        if: needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-cli-signed-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-package
      - name: Download the independent unsigned Windows CLI baseline
        if: needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-packaging-baseline
      - name: Download the explicitly unsigned Windows CLI candidate
        if: needs.create-release.outputs.windows_signing_backend == 'unsigned'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-package
      - name: Revalidate and package the selected Windows CLI candidate
        shell: pwsh
        env:
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ needs.create-release.outputs.windows_subscriber_eku }}
          WINDOWS_SIGNING_BACKEND: ${{ needs.create-release.outputs.windows_signing_backend }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-package'
          $candidate = Join-Path $stage 'candidate'
          $manifest = if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            Join-Path $stage 'inventory.json'
          } else {
            Join-Path $stage 'unsigned-inventory.json'
          }
          python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --expect-manifest $manifest $candidate
          if ($LASTEXITCODE -ne 0) { throw "Selected candidate validation failed with exit code $LASTEXITCODE" }
          if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            $baselineStage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-packaging-baseline'
            $baselineCandidate = Join-Path $baselineStage 'candidate'
            $baselineManifest = Join-Path $baselineStage 'unsigned-inventory.json'
            $baselineCatalog = Join-Path $baselineStage 'signing-catalog.txt'
            $validatedBaselineCatalog = Join-Path $baselineStage 'validated-packaging-signing-catalog.txt'
            python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --expect-manifest $baselineManifest $baselineCandidate
            if ($LASTEXITCODE -ne 0) { throw "Independent unsigned baseline validation failed with exit code $LASTEXITCODE" }
            python tools/create_windows_signing_catalog.py --manifest $baselineManifest --output $validatedBaselineCatalog --surface cli --architecture x64 $baselineCandidate
            if ($LASTEXITCODE -ne 0) { throw "Independent signing catalog validation failed with exit code $LASTEXITCODE" }
            $expectedCatalogHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $baselineCatalog).Hash
            $actualCatalogHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $validatedBaselineCatalog).Hash
            if ($actualCatalogHash -ne $expectedCatalogHash) { throw 'Independent signing catalog does not match the unsigned baseline.' }
            Copy-Item -LiteralPath $baselineManifest -Destination (Join-Path $stage 'packaging-unsigned-inventory.json')
            Copy-Item -LiteralPath $baselineCatalog -Destination (Join-Path $stage 'packaging-signing-catalog.txt')
            $deltaReceipt = Join-Path $stage 'packaging-signing-delta.json'
            python tools/validate_windows_signing_delta.py --before $baselineManifest --after $manifest --catalog $validatedBaselineCatalog --before-root $baselineCandidate --after-root $candidate --receipt $deltaReceipt
            if ($LASTEXITCODE -ne 0) { throw "Selected candidate signing delta validation failed with exit code $LASTEXITCODE" }
            $receipt = Join-Path $stage 'packaging-signature-verification.json'
            python tools/verify_windows_signatures.py --manifest $manifest --surface cli --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $candidate
            if ($LASTEXITCODE -ne 0) { throw "Selected candidate signature verification failed with exit code $LASTEXITCODE" }
          }
          $destination = 'collector/build/quotabot_cli_release/bundle'
          New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
          if (Test-Path -LiteralPath $destination) { throw 'Package destination unexpectedly exists.' }
          Copy-Item -LiteralPath $candidate -Destination $destination -Recurse
          ./tools/package-cli.ps1 -PackageOnly
      - name: Verify the Windows CLI archive shape and checksum
        run: python tools/verify_cli_archive.py release/quotabot-windows-x64.zip
      - name: Bind the Windows CLI archive to its native inventory
        shell: pwsh
        env:
          WINDOWS_SIGNING_BACKEND: ${{ needs.create-release.outputs.windows_signing_backend }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-package'
          $manifest = if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            Join-Path $stage 'inventory.json'
          } else {
            Join-Path $stage 'unsigned-inventory.json'
          }
          $extract = Join-Path $env:RUNNER_TEMP "quotabot-windows-cli-$([Guid]::NewGuid().ToString('N'))"
          Expand-Archive -LiteralPath 'release/quotabot-windows-x64.zip' -DestinationPath $extract
          python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --expect-manifest $manifest $extract
          if ($LASTEXITCODE -ne 0) { throw "Packaged archive inventory mismatch with exit code $LASTEXITCODE" }
      - name: Preserve the Windows CLI signing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cli-native-signing-inventory
          path: |
            ${{ runner.temp }}/quotabot-windows-cli-package/*.json
            ${{ runner.temp }}/quotabot-windows-cli-package/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Attest Windows CLI archive build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/quotabot-windows-x64.zip
      - name: Upload the Windows CLI asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/quotabot-windows-x64.zip \
            release/quotabot-windows-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  verify-cli-release:
    needs: [create-release, build, package-macos-cli, package-windows-cli]
    if: >-
      ${{ always() &&
          needs.create-release.result == 'success' &&
          needs.build.result == 'success' &&
          needs.package-macos-cli.result == 'success' &&
          needs.package-windows-cli.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: quotabot-windows-x64.zip
          - os: macos-15
            archive: quotabot-darwin-arm64.tar.gz
          - os: ubuntu-latest
            archive: quotabot-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            archive: quotabot-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QUOTABOT_DEMO: '1'
    permissions:
      # GitHub exposes draft releases only to push-capable identities. This job
      # performs reads only, but contents: write is required to see the draft.
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the pinned Apple toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          bash tools/require-macos-toolchain.sh
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the accepted macOS CLI notarization evidence
        if: runner.os == 'macOS' && needs.create-release.outputs.macos_signing_mode == 'developer-id'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-cli-native-signing-inventory
          path: ${{ runner.temp }}/quotabot-macos-cli-draft-evidence
      - name: Download the draft CLI asset and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo 'Draft release id is invalid.' >&2; exit 1 ;;
          esac
          destination="$RUNNER_TEMP/quotabot-cli-release"
          mkdir -p "$destination"
          for name in "${{ matrix.archive }}" "${{ matrix.archive }}.sha256"; do
            asset_id="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --paginate \
              --jq ".[] | select(.name == \"$name\") | .id")"
            case "$asset_id" in
              ''|*[!0-9]*) echo "Draft asset id is invalid for $name." >&2; exit 1 ;;
            esac
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$destination/$name"
          done
      - name: Reverify downloaded CLI archive and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive="$RUNNER_TEMP/quotabot-cli-release/${{ matrix.archive }}"
          python tools/verify_cli_archive.py "$archive"
          source_digest="$(git rev-parse 'HEAD^{commit}')"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --source-digest "$source_digest" \
            --deny-self-hosted-runners
      - name: Exercise the downloaded Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ needs.create-release.outputs.windows_subscriber_eku }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'quotabot-cli-release\${{ matrix.archive }}'
          $expanded = Join-Path $env:RUNNER_TEMP 'quotabot-cli-expanded'
          $manifest = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-draft-inventory.json'
          $receipt = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-draft-signature-verification.json'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'quotabot-cli-state'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $inventory = python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --json $expanded
          if ($LASTEXITCODE -ne 0) { throw "Downloaded CLI native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          if ('${{ needs.create-release.outputs.windows_signing_backend }}' -eq 'azure-artifact-signing') {
            python tools/verify_windows_signatures.py --manifest $manifest --surface cli --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $expanded
            if ($LASTEXITCODE -ne 0) { throw "Downloaded CLI signature verification failed with exit code $LASTEXITCODE" }
          }
          $executable = Join-Path $expanded 'bin\quotabot.exe'
          $expectedVersion = 'quotabot ' + $env:GITHUB_REF_NAME.TrimStart('v')
          $actualVersion = & $executable --version
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne $expectedVersion) {
            throw "Expected $expectedVersion, got $actualVersion"
          }
          $doctor = & $executable doctor --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $doctor.schema -ne 'quotabot.v1') {
            throw 'Downloaded CLI doctor check failed.'
          }
          if ('${{ needs.create-release.outputs.windows_signing_backend }}' -eq 'azure-artifact-signing') {
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-draft-archive.sha256') -Value "$digest  ${{ matrix.archive }}" -Encoding ascii
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-draft-signing-mode.txt') -Value 'azure-artifact-signing' -Encoding ascii
          }
      - name: Preserve downloaded Windows CLI signature evidence
        if: always() && runner.os == 'Windows' && needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cli-draft-signature-verification
          path: |
            ${{ runner.temp }}/quotabot-windows-cli-draft-inventory.json
            ${{ runner.temp }}/quotabot-windows-cli-draft-signature-verification.json
            ${{ runner.temp }}/quotabot-windows-cli-draft-archive.sha256
            ${{ runner.temp }}/quotabot-windows-cli-draft-signing-mode.txt
          if-no-files-found: error
          retention-days: 14
      - name: Exercise the downloaded macOS or Linux CLI
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          MACOS_DEVELOPER_IDENTITY: ${{ needs.create-release.outputs.macos_developer_identity }}
          MACOS_SIGNING_MODE: ${{ needs.create-release.outputs.macos_signing_mode }}
          MACOS_TEAM_ID: ${{ needs.create-release.outputs.macos_team_id }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/quotabot-cli-release/${{ matrix.archive }}"
          expanded="$RUNNER_TEMP/quotabot-cli-expanded"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/quotabot-cli-state"
          mkdir -p "$expanded" "$XDG_CONFIG_HOME"
          tar -xzf "$archive" -C "$expanded"
          if [ "$RUNNER_OS" = macOS ]; then
            manifest="$RUNNER_TEMP/quotabot-macos-cli-draft-inventory.json"
            python tools/native_code_inventory.py \
              --platform macos --surface cli --architecture arm64 --json \
              "$expanded" > "$manifest"
            if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
              evidence="$RUNNER_TEMP/quotabot-macos-cli-draft-evidence"
              python tools/native_code_inventory.py \
                --platform macos --surface cli --architecture arm64 \
                --expect-manifest "$evidence/inventory.json" "$expanded"
              python tools/verify_macos_signatures.py \
                --manifest "$manifest" \
                --signing-plan "$evidence/signing-plan.json" \
                --notarization-receipt "$evidence/notarization.json" \
                --surface cli --architecture arm64 \
                --expected-identity "$MACOS_DEVELOPER_IDENTITY" \
                --expected-team-id "$MACOS_TEAM_ID" \
                --receipt "$RUNNER_TEMP/quotabot-macos-cli-draft-signature-verification.json" \
                "$expanded"
            fi
          fi
          executable="$expanded/bin/quotabot"
          test -x "$executable"
          expected_version="quotabot ${GITHUB_REF_NAME#v}"
          actual_version="$("$executable" --version)"
          [[ "$actual_version" == "$expected_version" ]] || {
            echo "Expected $expected_version, got $actual_version" >&2
            exit 1
          }
          "$executable" doctor --json \
            | python -c 'import json, sys; assert json.load(sys.stdin)["schema"] == "quotabot.v1"'
          if [ "$RUNNER_OS" = macOS ] && [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            digest="$(shasum -a 256 "$archive" | awk '{print $1}')"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "$digest" "${{ matrix.archive }}" \
              > "$RUNNER_TEMP/quotabot-macos-cli-draft-archive.sha256"
            printf '%s\n' "$MACOS_SIGNING_MODE" \
              > "$RUNNER_TEMP/quotabot-macos-cli-draft-signing-mode.txt"
          fi
      - name: Preserve downloaded macOS CLI signature evidence
        if: always() && runner.os == 'macOS' && needs.create-release.outputs.macos_signing_mode == 'developer-id'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-cli-draft-signature-verification
          path: |
            ${{ runner.temp }}/quotabot-macos-cli-draft-*.json
            ${{ runner.temp }}/quotabot-macos-cli-draft-archive.sha256
            ${{ runner.temp }}/quotabot-macos-cli-draft-signing-mode.txt
          if-no-files-found: error
          retention-days: 14

  build-macos-desktop-unsigned:
    needs: create-release
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the pinned Apple toolchain
        run: bash tools/require-macos-toolchain.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up pinned Flutter SDK
        shell: pwsh
        run: >
          ./tools/setup-flutter-ci.ps1
          -FlutterVersion '3.44.6'
          -ExpectedCommit 'ee80f08bbf97172ec030b8751ceab557177a34a6'
      - name: Resolve desktop dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Build and inventory the unsigned macOS desktop candidate
        run: |
          set -euo pipefail
          bash tools/package-macos.sh --no-archive
          source='app/build/macos/Build/Products/Release/quotabot.app'
          stage="$RUNNER_TEMP/quotabot-macos-desktop-unsigned"
          candidate="$stage/candidate"
          mkdir -p "$candidate"
          ditto "$source" "$candidate/quotabot.app"
          python tools/native_code_inventory.py \
            --platform macos --surface desktop --architecture arm64 --json \
            "$candidate" > "$stage/unsigned-inventory.json"
          python tools/create_macos_signing_plan.py \
            --manifest "$stage/unsigned-inventory.json" \
            --output "$stage/signing-plan.json" \
            --surface desktop --architecture arm64 "$candidate"
          ditto -c -k --sequesterRsrc --keepParent \
            "$candidate" "$stage/candidate.zip"
          rm -rf "$candidate"
      - name: Preserve the immutable unsigned macOS desktop candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-macos-desktop-unsigned
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  sign-macos-desktop:
    needs: [create-release, build-macos-desktop-unsigned]
    if: needs.create-release.outputs.macos_signing_mode == 'developer-id'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    environment: release-signing-macos
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the pinned Apple toolchain
        run: bash tools/require-macos-toolchain.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the immutable unsigned macOS desktop candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-macos-desktop-signing
      - name: Validate, sign, notarize, staple, and verify the macOS desktop candidate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.QUOTABOT_MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.QUOTABOT_MACOS_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_IDENTITY: ${{ needs.create-release.outputs.macos_developer_identity }}
          MACOS_NOTARY_ISSUER_ID: ${{ needs.create-release.outputs.macos_notary_issuer_id }}
          MACOS_NOTARY_KEY_ID: ${{ needs.create-release.outputs.macos_notary_key_id }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.QUOTABOT_MACOS_NOTARY_KEY_P8 }}
          MACOS_TEAM_ID: ${{ needs.create-release.outputs.macos_team_id }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/quotabot-macos-desktop-signing"
          candidate="$stage/candidate"
          unsigned_manifest="$stage/unsigned-inventory.json"
          plan="$stage/signing-plan.json"
          validated_plan="$stage/validated-signing-plan.json"
          keychain="$RUNNER_TEMP/quotabot-desktop-signing.keychain-db"
          certificate="$stage/developer-id.p12"
          notary_key="$stage/notary-key.p8"
          submission="$stage/notary-submission.zip"
          submission_check="$stage/notary-submission-expanded"
          submission_json="$stage/notary-submission.json"
          notary_log="$stage/notary-log.json"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$submission_check"
            rm -f "$certificate" "$notary_key" "$submission" \
              "$submission_json" "$notary_log"
          }
          trap cleanup EXIT

          [[ -f "$stage/candidate.zip" ]] || {
            echo 'The immutable macOS desktop handoff archive is missing.' >&2
            exit 1
          }
          ditto -x -k "$stage/candidate.zip" "$stage"
          rm -f "$stage/candidate.zip"
          [[ -n "$MACOS_CERTIFICATE_P12_BASE64" && \
             -n "$MACOS_CERTIFICATE_PASSWORD" && \
             -n "$MACOS_DEVELOPER_IDENTITY" && \
             -n "$MACOS_NOTARY_ISSUER_ID" && \
             -n "$MACOS_NOTARY_KEY_ID" && \
             -n "$MACOS_NOTARY_KEY_P8" && \
             -n "$MACOS_TEAM_ID" ]] || {
            echo 'The protected macOS signing environment is incomplete.' >&2
            exit 1
          }
          python tools/native_code_inventory.py \
            --platform macos --surface desktop --architecture arm64 \
            --expect-manifest "$unsigned_manifest" "$candidate"
          python tools/create_macos_signing_plan.py \
            --manifest "$unsigned_manifest" --output "$validated_plan" \
            --surface desktop --architecture arm64 "$candidate"
          cmp -s "$plan" "$validated_plan" || {
            echo 'The downloaded macOS desktop signing plan changed.' >&2
            exit 1
          }

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" \
            | openssl base64 -d -A -out "$certificate"
          printf '%s' "$MACOS_NOTARY_KEY_P8" > "$notary_key"
          [[ -s "$certificate" && $(stat -f '%z' "$certificate") -le 262144 ]]
          [[ -s "$notary_key" && $(stat -f '%z' "$notary_key") -le 16384 ]]
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null

          python tools/sign_macos_candidate.py \
            --manifest "$unsigned_manifest" --plan "$plan" \
            --identity "$MACOS_DEVELOPER_IDENTITY" --team-id "$MACOS_TEAM_ID" \
            --keychain "$keychain" \
            --entitlements app/macos/Runner/DeveloperID.entitlements \
            --receipt "$stage/signing.json" "$candidate"
          python tools/native_code_inventory.py \
            --platform macos --surface desktop --architecture arm64 --json \
            "$candidate" > "$stage/signed-inventory.json"
          python tools/validate_macos_signing_delta.py \
            --before "$unsigned_manifest" --after "$stage/signed-inventory.json" \
            --plan "$plan" --operation signing \
            --receipt "$stage/signing-delta.json"
          ditto -c -k --sequesterRsrc --keepParent \
            "$candidate/quotabot.app" "$submission"
          mkdir "$submission_check"
          ditto -x -k "$submission" "$submission_check"
          python tools/native_code_inventory.py \
            --platform macos --surface desktop --architecture arm64 \
            --expect-manifest "$stage/signed-inventory.json" "$submission_check"
          python tools/native_code_inventory.py \
            --platform macos --surface desktop --architecture arm64 --json \
            "$submission_check" > "$stage/submission-inventory.json"
          rm -rf "$submission_check"
          if ! xcrun notarytool submit "$submission" --wait --output-format json \
            --key "$notary_key" --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" > "$submission_json"; then
            echo 'Apple did not accept the macOS desktop notarization request.' >&2
            exit 1
          fi
          submission_id="$(plutil -extract id raw -o - "$submission_json")"
          [[ "$submission_id" =~ ^[0-9A-Fa-f-]{36}$ ]] || {
            echo 'Apple returned an invalid notarization submission id.' >&2
            exit 1
          }
          xcrun notarytool log "$submission_id" --output-format json \
            --key "$notary_key" --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" > "$notary_log"
          python tools/record_macos_notarization.py \
            --submission "$submission_json" --log "$notary_log" \
            --artifact "$submission" --inventory "$stage/submission-inventory.json" \
            --signing-receipt "$stage/signing.json" \
            --surface desktop --receipt "$stage/notarization.json"
          xcrun stapler staple "$candidate/quotabot.app"
          python tools/native_code_inventory.py \
            --platform macos --surface desktop --architecture arm64 --json \
            "$candidate" > "$stage/inventory.json"
          python tools/validate_macos_signing_delta.py \
            --before "$stage/signed-inventory.json" --after "$stage/inventory.json" \
            --plan "$plan" --operation stapling \
            --receipt "$stage/stapling-delta.json"
          python tools/verify_macos_signatures.py \
            --manifest "$stage/inventory.json" \
            --signing-plan "$plan" \
            --notarization-receipt "$stage/notarization.json" \
            --stapling-delta-receipt "$stage/stapling-delta.json" \
            --surface desktop --architecture arm64 \
            --expected-identity "$MACOS_DEVELOPER_IDENTITY" \
            --expected-team-id "$MACOS_TEAM_ID" \
            --expected-entitlements app/macos/Runner/DeveloperID.entitlements \
            --receipt "$stage/signature-verification.json" "$candidate"
          ditto -c -k --sequesterRsrc --keepParent \
            "$candidate" "$stage/candidate.zip"
          rm -rf "$candidate"
          cleanup
          trap - EXIT
      - name: Preserve the immutable signed macOS desktop candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-desktop-signed-candidate
          path: ${{ runner.temp }}/quotabot-macos-desktop-signing
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  package-macos-desktop:
    needs: [create-release, build-macos-desktop-unsigned, sign-macos-desktop]
    if: >-
      ${{ always() &&
          needs.create-release.result == 'success' &&
          needs.build-macos-desktop-unsigned.result == 'success' &&
          ((needs.create-release.outputs.macos_signing_mode == 'unsigned' &&
            needs.sign-macos-desktop.result == 'skipped') ||
           (needs.create-release.outputs.macos_signing_mode == 'developer-id' &&
            needs.sign-macos-desktop.result == 'success')) }}
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the pinned Apple toolchain
        run: bash tools/require-macos-toolchain.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the signed macOS desktop candidate
        if: needs.create-release.outputs.macos_signing_mode == 'developer-id'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-desktop-signed-candidate
          path: ${{ runner.temp }}/quotabot-macos-desktop-package
      - name: Download the explicitly unsigned macOS desktop candidate
        if: needs.create-release.outputs.macos_signing_mode == 'unsigned'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-macos-desktop-package
      - name: Revalidate and package the selected macOS desktop candidate
        env:
          MACOS_DEVELOPER_IDENTITY: ${{ needs.create-release.outputs.macos_developer_identity }}
          MACOS_SIGNING_MODE: ${{ needs.create-release.outputs.macos_signing_mode }}
          MACOS_TEAM_ID: ${{ needs.create-release.outputs.macos_team_id }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/quotabot-macos-desktop-package"
          candidate="$stage/candidate"
          [[ -f "$stage/candidate.zip" ]] || {
            echo 'The selected macOS desktop handoff archive is missing.' >&2
            exit 1
          }
          ditto -x -k "$stage/candidate.zip" "$stage"
          rm -f "$stage/candidate.zip"
          if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            manifest="$stage/inventory.json"
          else
            manifest="$stage/unsigned-inventory.json"
          fi
          python tools/native_code_inventory.py \
            --platform macos --surface desktop --architecture arm64 \
            --expect-manifest "$manifest" "$candidate"
          if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            python tools/verify_macos_signatures.py \
              --manifest "$manifest" \
              --signing-plan "$stage/signing-plan.json" \
              --notarization-receipt "$stage/notarization.json" \
              --stapling-delta-receipt "$stage/stapling-delta.json" \
              --surface desktop --architecture arm64 \
              --expected-identity "$MACOS_DEVELOPER_IDENTITY" \
              --expected-team-id "$MACOS_TEAM_ID" \
              --expected-entitlements app/macos/Runner/DeveloperID.entitlements \
              --receipt "$stage/packaging-signature-verification.json" \
              "$candidate"
          fi
          destination='app/build/macos/Build/Products/Release/quotabot.app'
          mkdir -p "$(dirname "$destination")"
          [[ ! -e "$destination" ]] || {
            echo 'Package destination unexpectedly exists.' >&2
            exit 1
          }
          ditto "$candidate/quotabot.app" "$destination"
          bash tools/package-macos.sh --package-only
      - name: Verify and bind the macOS desktop archive
        env:
          MACOS_SIGNING_MODE: ${{ needs.create-release.outputs.macos_signing_mode }}
        run: |
          set -euo pipefail
          python tools/verify_desktop_archive.py \
            release/quotabot-darwin-arm64-desktop.zip
          stage="$RUNNER_TEMP/quotabot-macos-desktop-package"
          if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            manifest="$stage/inventory.json"
          else
            manifest="$stage/unsigned-inventory.json"
          fi
          expanded="$RUNNER_TEMP/quotabot-macos-desktop-expanded"
          mkdir -p "$expanded"
          ditto -x -k release/quotabot-darwin-arm64-desktop.zip "$expanded"
          python tools/native_code_inventory.py \
            --platform macos --surface desktop --architecture arm64 \
            --expect-manifest "$manifest" "$expanded"
      - name: Preserve the macOS desktop signing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-desktop-native-signing-inventory
          path: ${{ runner.temp }}/quotabot-macos-desktop-package/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Attest macOS desktop archive build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/quotabot-darwin-arm64-desktop.zip
      - name: Upload the macOS desktop asset to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/quotabot-darwin-arm64-desktop.zip \
            release/quotabot-darwin-arm64-desktop.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  build-desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash tools/package-linux.sh
            archive: release/quotabot-linux-x64-desktop.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up pinned Flutter SDK
        shell: pwsh
        run: >
          ./tools/setup-flutter-ci.ps1
          -FlutterVersion '3.44.6'
          -ExpectedCommit 'ee80f08bbf97172ec030b8751ceab557177a34a6'
      - name: Install Linux desktop build prerequisites
        if: runner.os == 'Linux'
        run: >
          bash tools/install-linux-desktop-prereqs.sh
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libayatana-appindicator3-dev dbus-x11 xvfb
      - name: Resolve desktop dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Build and package the desktop asset
        run: ${{ matrix.script }}
      - name: Verify archive shape and checksum
        run: python tools/verify_desktop_archive.py "${{ matrix.archive }}"
      - name: Attest desktop archive build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}
      - name: Upload the desktop asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ matrix.archive }}" \
            "${{ matrix.archive }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build-windows-desktop-unsigned:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up pinned Flutter SDK
        shell: pwsh
        run: >
          ./tools/setup-flutter-ci.ps1
          -FlutterVersion '3.44.6'
          -ExpectedCommit 'ee80f08bbf97172ec030b8751ceab557177a34a6'
      - name: Build and inventory the unsigned Windows desktop candidate
        shell: pwsh
        run: |
          ./tools/package-windows.ps1 -NoArchive
          $source = 'app/build/windows/x64/runner/Release'
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-unsigned'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'unsigned-inventory.json'
          $catalog = Join-Path $stage 'signing-catalog.txt'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $source -Destination $candidate -Recurse
          $inventory = python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --json $candidate
          if ($LASTEXITCODE -ne 0) { throw "Unsigned native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          python tools/create_windows_signing_catalog.py --manifest $manifest --output $catalog --surface desktop --architecture x64 $candidate
          if ($LASTEXITCODE -ne 0) { throw "Signing catalog creation failed with exit code $LASTEXITCODE" }
      - name: Preserve the immutable unsigned Windows desktop candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-unsigned
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  sign-windows-desktop:
    needs: [create-release, build-windows-desktop-unsigned]
    if: needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
    runs-on: windows-latest
    environment: release-signing
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the immutable unsigned Windows desktop candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-signing
      - name: Validate the complete candidate and exact signing catalog
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-signing'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'unsigned-inventory.json'
          $catalog = Join-Path $stage 'signing-catalog.txt'
          $validatedCatalog = Join-Path $stage 'validated-signing-catalog.txt'
          python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --expect-manifest $manifest $candidate
          if ($LASTEXITCODE -ne 0) { throw "Unsigned candidate validation failed with exit code $LASTEXITCODE" }
          python tools/create_windows_signing_catalog.py --manifest $manifest --output $validatedCatalog --surface desktop --architecture x64 $candidate
          if ($LASTEXITCODE -ne 0) { throw "Signing catalog validation failed with exit code $LASTEXITCODE" }
          $expectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $catalog).Hash
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $validatedCatalog).Hash
          if ($actualHash -ne $expectedHash) { throw 'Downloaded signing catalog does not match the validated candidate.' }
      - name: Authenticate the isolated signer to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.QUOTABOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.QUOTABOT_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.QUOTABOT_AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL
      - name: Sign the exact Windows desktop catalog with Azure Artifact Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.QUOTABOT_AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.QUOTABOT_AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.QUOTABOT_AZURE_CERTIFICATE_PROFILE }}
          files-catalog: ${{ runner.temp }}\quotabot-windows-desktop-signing\validated-signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: false
          enhanced-key-usage: 1.3.6.1.5.5.7.3.3
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          timeout: 300
          batch-size: 0
          cache-dependencies: false
          trace: false
      - name: Redownload the pristine unsigned Windows desktop baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-signing-baseline
      - name: Verify the signed Windows desktop candidate
        shell: pwsh
        env:
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ needs.create-release.outputs.windows_subscriber_eku }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-signing'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'inventory.json'
          $receipt = Join-Path $stage 'signature-verification.json'
          $deltaReceipt = Join-Path $stage 'signing-delta.json'
          $baselineStage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-signing-baseline'
          $baselineCandidate = Join-Path $baselineStage 'candidate'
          $baselineManifest = Join-Path $baselineStage 'unsigned-inventory.json'
          $baselineCatalog = Join-Path $baselineStage 'signing-catalog.txt'
          $validatedBaselineCatalog = Join-Path $baselineStage 'validated-signing-catalog.txt'
          python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --expect-manifest $baselineManifest $baselineCandidate
          if ($LASTEXITCODE -ne 0) { throw "Pristine unsigned baseline validation failed with exit code $LASTEXITCODE" }
          python tools/create_windows_signing_catalog.py --manifest $baselineManifest --output $validatedBaselineCatalog --surface desktop --architecture x64 $baselineCandidate
          if ($LASTEXITCODE -ne 0) { throw "Pristine signing catalog validation failed with exit code $LASTEXITCODE" }
          $expectedCatalogHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $baselineCatalog).Hash
          $actualCatalogHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $validatedBaselineCatalog).Hash
          if ($actualCatalogHash -ne $expectedCatalogHash) { throw 'Pristine signing catalog does not match the unsigned baseline.' }
          $inventory = python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --json $candidate
          if ($LASTEXITCODE -ne 0) { throw "Post-signing native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          python tools/validate_windows_signing_delta.py --before $baselineManifest --after $manifest --catalog $validatedBaselineCatalog --before-root $baselineCandidate --after-root $candidate --receipt $deltaReceipt
          if ($LASTEXITCODE -ne 0) { throw "Windows signing delta validation failed with exit code $LASTEXITCODE" }
          python tools/verify_windows_signatures.py --manifest $manifest --surface desktop --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $candidate
          if ($LASTEXITCODE -ne 0) { throw "Windows signature verification failed with exit code $LASTEXITCODE" }
      - name: Preserve the immutable signed Windows desktop candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-signed-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-signing
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  package-windows-desktop:
    needs: [create-release, build-windows-desktop-unsigned, sign-windows-desktop]
    if: >-
      ${{ always() &&
          needs.create-release.result == 'success' &&
          needs.build-windows-desktop-unsigned.result == 'success' &&
          ((needs.create-release.outputs.windows_signing_backend == 'unsigned' &&
            needs.sign-windows-desktop.result == 'skipped') ||
           (needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing' &&
            needs.sign-windows-desktop.result == 'success')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the signed Windows desktop candidate
        if: needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-desktop-signed-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-package
      - name: Download the independent unsigned Windows desktop baseline
        if: needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-packaging-baseline
      - name: Download the explicitly unsigned Windows desktop candidate
        if: needs.create-release.outputs.windows_signing_backend == 'unsigned'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-package
      - name: Revalidate and package the selected Windows desktop candidate
        shell: pwsh
        env:
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ needs.create-release.outputs.windows_subscriber_eku }}
          WINDOWS_SIGNING_BACKEND: ${{ needs.create-release.outputs.windows_signing_backend }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-package'
          $candidate = Join-Path $stage 'candidate'
          $manifest = if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            Join-Path $stage 'inventory.json'
          } else {
            Join-Path $stage 'unsigned-inventory.json'
          }
          python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --expect-manifest $manifest $candidate
          if ($LASTEXITCODE -ne 0) { throw "Selected candidate validation failed with exit code $LASTEXITCODE" }
          if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            $baselineStage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-packaging-baseline'
            $baselineCandidate = Join-Path $baselineStage 'candidate'
            $baselineManifest = Join-Path $baselineStage 'unsigned-inventory.json'
            $baselineCatalog = Join-Path $baselineStage 'signing-catalog.txt'
            $validatedBaselineCatalog = Join-Path $baselineStage 'validated-packaging-signing-catalog.txt'
            python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --expect-manifest $baselineManifest $baselineCandidate
            if ($LASTEXITCODE -ne 0) { throw "Independent unsigned baseline validation failed with exit code $LASTEXITCODE" }
            python tools/create_windows_signing_catalog.py --manifest $baselineManifest --output $validatedBaselineCatalog --surface desktop --architecture x64 $baselineCandidate
            if ($LASTEXITCODE -ne 0) { throw "Independent signing catalog validation failed with exit code $LASTEXITCODE" }
            $expectedCatalogHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $baselineCatalog).Hash
            $actualCatalogHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $validatedBaselineCatalog).Hash
            if ($actualCatalogHash -ne $expectedCatalogHash) { throw 'Independent signing catalog does not match the unsigned baseline.' }
            Copy-Item -LiteralPath $baselineManifest -Destination (Join-Path $stage 'packaging-unsigned-inventory.json')
            Copy-Item -LiteralPath $baselineCatalog -Destination (Join-Path $stage 'packaging-signing-catalog.txt')
            $deltaReceipt = Join-Path $stage 'packaging-signing-delta.json'
            python tools/validate_windows_signing_delta.py --before $baselineManifest --after $manifest --catalog $validatedBaselineCatalog --before-root $baselineCandidate --after-root $candidate --receipt $deltaReceipt
            if ($LASTEXITCODE -ne 0) { throw "Selected candidate signing delta validation failed with exit code $LASTEXITCODE" }
            $receipt = Join-Path $stage 'packaging-signature-verification.json'
            python tools/verify_windows_signatures.py --manifest $manifest --surface desktop --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $candidate
            if ($LASTEXITCODE -ne 0) { throw "Selected candidate signature verification failed with exit code $LASTEXITCODE" }
          }
          $destination = 'app/build/windows/x64/runner/Release'
          New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
          if (Test-Path -LiteralPath $destination) { throw 'Package destination unexpectedly exists.' }
          Copy-Item -LiteralPath $candidate -Destination $destination -Recurse
          ./tools/package-windows.ps1 -PackageOnly
      - name: Verify the Windows desktop archive shape and checksum
        run: python tools/verify_desktop_archive.py release/quotabot-windows-x64-desktop.zip
      - name: Bind the Windows desktop archive to its native inventory
        shell: pwsh
        env:
          WINDOWS_SIGNING_BACKEND: ${{ needs.create-release.outputs.windows_signing_backend }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-package'
          $manifest = if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            Join-Path $stage 'inventory.json'
          } else {
            Join-Path $stage 'unsigned-inventory.json'
          }
          $extract = Join-Path $env:RUNNER_TEMP "quotabot-windows-desktop-$([Guid]::NewGuid().ToString('N'))"
          Expand-Archive -LiteralPath 'release/quotabot-windows-x64-desktop.zip' -DestinationPath $extract
          python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --expect-manifest $manifest $extract
          if ($LASTEXITCODE -ne 0) { throw "Packaged archive inventory mismatch with exit code $LASTEXITCODE" }
      - name: Preserve the Windows desktop signing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-native-signing-inventory
          path: |
            ${{ runner.temp }}/quotabot-windows-desktop-package/*.json
            ${{ runner.temp }}/quotabot-windows-desktop-package/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Attest Windows desktop archive build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/quotabot-windows-x64-desktop.zip
      - name: Upload the Windows desktop asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/quotabot-windows-x64-desktop.zip \
            release/quotabot-windows-x64-desktop.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  verify-desktop-release:
    needs: [create-release, build-desktop, package-macos-desktop, package-windows-desktop]
    if: >-
      ${{ always() &&
          needs.create-release.result == 'success' &&
          needs.build-desktop.result == 'success' &&
          needs.package-macos-desktop.result == 'success' &&
          needs.package-windows-desktop.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: quotabot-windows-x64-desktop.zip
          - os: macos-15
            archive: quotabot-darwin-arm64-desktop.zip
          - os: ubuntu-latest
            archive: quotabot-linux-x64-desktop.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      # GitHub exposes draft releases only to push-capable identities. This job
      # performs reads only, but contents: write is required to see the draft.
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the pinned Apple toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          bash tools/require-macos-toolchain.sh
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the accepted macOS desktop notarization evidence
        if: runner.os == 'macOS' && needs.create-release.outputs.macos_signing_mode == 'developer-id'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-desktop-native-signing-inventory
          path: ${{ runner.temp }}/quotabot-macos-desktop-draft-evidence
      - name: Download the draft desktop asset and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo 'Draft release id is invalid.' >&2; exit 1 ;;
          esac
          destination="$RUNNER_TEMP/quotabot-release"
          mkdir -p "$destination"
          for name in "${{ matrix.archive }}" "${{ matrix.archive }}.sha256"; do
            asset_id="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --paginate \
              --jq ".[] | select(.name == \"$name\") | .id")"
            case "$asset_id" in
              ''|*[!0-9]*) echo "Draft asset id is invalid for $name." >&2; exit 1 ;;
            esac
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$destination/$name"
          done
      - name: Reverify downloaded archive shape and checksum
        shell: bash
        run: python tools/verify_desktop_archive.py "$RUNNER_TEMP/quotabot-release/${{ matrix.archive }}"
      - name: Verify downloaded archive provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source_digest="$(git rev-parse 'HEAD^{commit}')"
          gh attestation verify "$RUNNER_TEMP/quotabot-release/${{ matrix.archive }}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --source-digest "$source_digest" \
            --deny-self-hosted-runners
      - name: Verify downloaded Windows desktop signatures
        if: runner.os == 'Windows' && needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
        shell: pwsh
        env:
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ needs.create-release.outputs.windows_subscriber_eku }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'quotabot-release\${{ matrix.archive }}'
          $expanded = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-draft-expanded'
          $manifest = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-draft-inventory.json'
          $receipt = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-draft-signature-verification.json'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $inventory = python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --json $expanded
          if ($LASTEXITCODE -ne 0) { throw "Downloaded desktop native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          python tools/verify_windows_signatures.py --manifest $manifest --surface desktop --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $expanded
          if ($LASTEXITCODE -ne 0) { throw "Downloaded desktop signature verification failed with exit code $LASTEXITCODE" }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-draft-archive.sha256') -Value "$digest  ${{ matrix.archive }}" -Encoding ascii
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-draft-signing-mode.txt') -Value 'azure-artifact-signing' -Encoding ascii
      - name: Preserve downloaded Windows desktop signature evidence
        if: always() && runner.os == 'Windows' && needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-draft-signature-verification
          path: |
            ${{ runner.temp }}/quotabot-windows-desktop-draft-inventory.json
            ${{ runner.temp }}/quotabot-windows-desktop-draft-signature-verification.json
            ${{ runner.temp }}/quotabot-windows-desktop-draft-archive.sha256
            ${{ runner.temp }}/quotabot-windows-desktop-draft-signing-mode.txt
          if-no-files-found: error
          retention-days: 14
      - name: Verify downloaded macOS desktop signatures and staple
        if: runner.os == 'macOS' && needs.create-release.outputs.macos_signing_mode == 'developer-id'
        env:
          MACOS_DEVELOPER_IDENTITY: ${{ needs.create-release.outputs.macos_developer_identity }}
          MACOS_TEAM_ID: ${{ needs.create-release.outputs.macos_team_id }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/quotabot-release/${{ matrix.archive }}"
          expanded="$RUNNER_TEMP/quotabot-macos-desktop-draft-expanded"
          evidence="$RUNNER_TEMP/quotabot-macos-desktop-draft-evidence"
          manifest="$RUNNER_TEMP/quotabot-macos-desktop-draft-inventory.json"
          mkdir -p "$expanded"
          ditto -x -k "$archive" "$expanded"
          python tools/native_code_inventory.py \
            --platform macos --surface desktop --architecture arm64 --json \
            "$expanded" > "$manifest"
          python tools/native_code_inventory.py \
            --platform macos --surface desktop --architecture arm64 \
            --expect-manifest "$evidence/inventory.json" "$expanded"
          python tools/verify_macos_signatures.py \
            --manifest "$manifest" \
            --signing-plan "$evidence/signing-plan.json" \
            --notarization-receipt "$evidence/notarization.json" \
            --stapling-delta-receipt "$evidence/stapling-delta.json" \
            --surface desktop --architecture arm64 \
            --expected-identity "$MACOS_DEVELOPER_IDENTITY" \
            --expected-team-id "$MACOS_TEAM_ID" \
            --expected-entitlements app/macos/Runner/DeveloperID.entitlements \
            --receipt "$RUNNER_TEMP/quotabot-macos-desktop-draft-signature-verification.json" \
            "$expanded"
          digest="$(shasum -a 256 "$archive" | awk '{print $1}')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$digest" "${{ matrix.archive }}" \
            > "$RUNNER_TEMP/quotabot-macos-desktop-draft-archive.sha256"
          printf '%s\n' developer-id \
            > "$RUNNER_TEMP/quotabot-macos-desktop-draft-signing-mode.txt"
      - name: Preserve downloaded macOS desktop signature evidence
        if: always() && runner.os == 'macOS' && needs.create-release.outputs.macos_signing_mode == 'developer-id'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-desktop-draft-signature-verification
          path: |
            ${{ runner.temp }}/quotabot-macos-desktop-draft-*.json
            ${{ runner.temp }}/quotabot-macos-desktop-draft-archive.sha256
            ${{ runner.temp }}/quotabot-macos-desktop-draft-signing-mode.txt
          if-no-files-found: error
          retention-days: 14
      - name: Download and verify the previous stable desktop asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resolve_tag_commit() {
            local tag="$1"
            local object_type object_sha
            read -r object_type object_sha < <(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '[.object.type, .object.sha] | @tsv')
            for _ in 1 2 3 4 5 6 7 8; do
              case "$object_type" in
                commit)
                  [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  read -r object_type object_sha < <(gh api \
                    "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                    --jq '[.object.type, .object.sha] | @tsv')
                  ;;
                *) return 1 ;;
              esac
            done
            return 1
          }

          previous_tag="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')"
          if [[ ! "$previous_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Previous stable release tag is invalid.' >&2
            exit 1
          fi
          if [ "$previous_tag" = "$GITHUB_REF_NAME" ]; then
            echo 'Previous stable release must differ from the candidate.' >&2
            exit 1
          fi
          previous_digest="$(resolve_tag_commit "$previous_tag")" || {
            echo 'Previous stable release tag does not resolve to one commit.' >&2
            exit 1
          }
          destination="$RUNNER_TEMP/quotabot-previous-release"
          mkdir -p "$destination"
          gh release download "$previous_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ matrix.archive }}" \
            --pattern "${{ matrix.archive }}.sha256" \
            --dir "$destination"
          printf '%s' "$previous_tag" > "$destination/tag"
          python tools/verify_desktop_archive.py \
            "$destination/${{ matrix.archive }}"
          gh attestation verify "$destination/${{ matrix.archive }}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$previous_tag" \
            --source-digest "$previous_digest" \
            --deny-self-hosted-runners
      - name: Install Linux desktop runtime prerequisites
        if: runner.os == 'Linux'
        run: >
          bash tools/install-linux-desktop-prereqs.sh
          libgtk-3-dev libayatana-appindicator3-dev dbus-x11 xvfb
      - name: Exercise the Windows portable lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'quotabot-release\${{ matrix.archive }}'
          $previousArchive = Join-Path $env:RUNNER_TEMP 'quotabot-previous-release\${{ matrix.archive }}'
          $current = Join-Path $env:RUNNER_TEMP 'quotabot-desktop-current'
          $previous = Join-Path $env:RUNNER_TEMP 'quotabot-desktop-previous'
          $config = Join-Path $env:RUNNER_TEMP 'quotabot-config'
          $sentinel = Join-Path $config 'quotabot\manual\release-sentinel'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $sentinel) | Out-Null
          New-Item -ItemType File -Force -Path $sentinel | Out-Null
          $env:LOCALAPPDATA = $config

          Expand-Archive -LiteralPath $previousArchive -DestinationPath $previous
          Expand-Archive -LiteralPath $archive -DestinationPath $current
          $readinessReport = Join-Path $env:RUNNER_TEMP 'quotabot-windows-current-readiness.json'
          $previousReadinessReport = Join-Path $env:RUNNER_TEMP 'quotabot-windows-previous-readiness.json'
          python tools/desktop_readiness_smoke.py `
            --executable (Join-Path $current 'quotabot.exe') `
            --report $readinessReport
          if ($LASTEXITCODE -ne 0) { throw 'Current desktop archive did not start.' }
          python tools/desktop_readiness_smoke.py `
            --executable (Join-Path $previous 'quotabot.exe') `
            --report $previousReadinessReport
          if ($LASTEXITCODE -ne 0) { throw 'Desktop rollback archive did not start.' }

          function Remove-PortableTree {
            param([Parameter(Mandatory = $true)][string]$LiteralPath)

            for ($attempt = 1; $attempt -le 10; $attempt++) {
              try {
                Remove-Item -LiteralPath $LiteralPath -Recurse -Force -ErrorAction Stop
                return
              } catch {
                if ($attempt -eq 10) { throw }
                Start-Sleep -Milliseconds 1000
              }
            }
          }

          Remove-PortableTree -LiteralPath $current
          Remove-PortableTree -LiteralPath $previous
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw 'Portable uninstall removed the persistent-state sentinel.'
          }
      - name: Exercise the Linux portable lifecycle
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          archive="$RUNNER_TEMP/quotabot-release/${{ matrix.archive }}"
          previous_archive="$RUNNER_TEMP/quotabot-previous-release/${{ matrix.archive }}"
          current="$RUNNER_TEMP/quotabot-desktop-current"
          previous="$RUNNER_TEMP/quotabot-desktop-previous"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/quotabot-config"
          sentinel="$XDG_CONFIG_HOME/quotabot/manual/release-sentinel"
          mkdir -p "$(dirname "$sentinel")" "$current" "$previous"
          : > "$sentinel"

          tar -xzf "$previous_archive" -C "$previous"
          tar -xzf "$archive" -C "$current"
          python tools/desktop_readiness_smoke.py \
            --executable "$current/quotabot" \
            --report "$RUNNER_TEMP/quotabot-linux-current-readiness.json"
          python tools/desktop_readiness_smoke.py \
            --executable "$previous/quotabot" \
            --report "$RUNNER_TEMP/quotabot-linux-previous-readiness.json"

          rm -rf "$current" "$previous"
          test -f "$sentinel"
      - name: Preserve portable desktop readiness evidence
        if: always() && (runner.os == 'Windows' || runner.os == 'Linux')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-readiness-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/quotabot-*-readiness.json
          if-no-files-found: error
          retention-days: 14
      - name: Exercise the macOS portable lifecycle
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          archive="$RUNNER_TEMP/quotabot-release/${{ matrix.archive }}"
          previous_archive="$RUNNER_TEMP/quotabot-previous-release/${{ matrix.archive }}"
          current="$RUNNER_TEMP/quotabot-desktop-current"
          previous="$RUNNER_TEMP/quotabot-desktop-previous"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/quotabot-config"
          sentinel="$XDG_CONFIG_HOME/quotabot/manual/release-sentinel"
          mkdir -p "$(dirname "$sentinel")" "$current" "$previous"
          : > "$sentinel"

          ditto -x -k "$previous_archive" "$previous"
          ditto -x -k "$archive" "$current"
          for bundle in "$current/quotabot.app" "$previous/quotabot.app"; do
            test -x "$bundle/Contents/MacOS/quotabot"
            plutil -lint "$bundle/Contents/Info.plist"
          done

          rm -rf "$current" "$previous"
          test -f "$sentinel"

  audit-release-assets:
    needs: [create-release, verify-cli-release, verify-desktop-release]
    if: >-
      ${{ always() &&
          needs.create-release.result == 'success' &&
          needs.verify-cli-release.result == 'success' &&
          needs.verify-desktop-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Draft asset listings require a push-capable token.
      contents: write
      attestations: read
    outputs:
      asset_manifest_sha256: ${{ steps.asset_manifest.outputs.asset_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the verified macOS CLI archive digest
        if: needs.create-release.outputs.macos_signing_mode == 'developer-id'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-cli-draft-signature-verification
          path: ${{ runner.temp }}/quotabot-final-macos-evidence/cli
      - name: Download the verified macOS desktop archive digest
        if: needs.create-release.outputs.macos_signing_mode == 'developer-id'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-desktop-draft-signature-verification
          path: ${{ runner.temp }}/quotabot-final-macos-evidence/desktop
      - name: Download the verified Windows CLI archive digest
        if: needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-cli-draft-signature-verification
          path: ${{ runner.temp }}/quotabot-final-windows-evidence/cli
      - name: Download the verified Windows desktop archive digest
        if: needs.create-release.outputs.windows_signing_backend == 'azure-artifact-signing'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-desktop-draft-signature-verification
          path: ${{ runner.temp }}/quotabot-final-windows-evidence/desktop
      - name: Require the exact complete release asset set
        id: asset_manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo 'Draft release id is invalid.' >&2; exit 1 ;;
          esac
          expected="$(printf '%s\n' \
            quotabot-darwin-arm64-desktop.zip \
            quotabot-darwin-arm64-desktop.zip.sha256 \
            quotabot-darwin-arm64.tar.gz \
            quotabot-darwin-arm64.tar.gz.sha256 \
            quotabot-linux-arm64.tar.gz \
            quotabot-linux-arm64.tar.gz.sha256 \
            quotabot-linux-x64-desktop.tar.gz \
            quotabot-linux-x64-desktop.tar.gz.sha256 \
            quotabot-linux-x64.tar.gz \
            quotabot-linux-x64.tar.gz.sha256 \
            quotabot-windows-x64-desktop.zip \
            quotabot-windows-x64-desktop.zip.sha256 \
            quotabot-windows-x64.zip \
            quotabot-windows-x64.zip.sha256 | sort)"
          actual="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --paginate \
            --jq '.[].name' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Draft release asset set is incomplete or unexpected.' >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          invalid="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --paginate \
            --jq '.[] | select(.state != "uploaded") | .name')"
          if [ -n "$invalid" ]; then
            echo "Draft release has assets that are not uploaded: $invalid" >&2
            exit 1
          fi
          manifest="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq 'sort_by(.name) | .[] | [.id, .name, .size, .state, .updated_at] | @tsv')"
          manifest_sha256="$(printf '%s\n' "$manifest" | sha256sum | awk '{print $1}')"
          echo "asset_manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
      - name: Reverify every final archive, checksum, and attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          MACOS_SIGNING_MODE: ${{ needs.create-release.outputs.macos_signing_mode }}
          WINDOWS_SIGNING_BACKEND: ${{ needs.create-release.outputs.windows_signing_backend }}
        run: |
          destination="$RUNNER_TEMP/quotabot-final-assets"
          mkdir -p "$destination"
          names="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --paginate \
            --jq '.[].name')"
          while IFS= read -r name; do
            asset_id="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --paginate \
              --jq ".[] | select(.name == \"$name\") | .id")"
            case "$asset_id" in
              ''|*[!0-9]*) echo "Draft asset id is invalid for $name." >&2; exit 1 ;;
            esac
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$destination/$name"
          done <<< "$names"

          (cd "$destination" && sha256sum --check ./*.sha256)
          if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            evidence="$RUNNER_TEMP/quotabot-final-macos-evidence"
            [[ "$(cat "$evidence/cli/quotabot-macos-cli-draft-signing-mode.txt")" == developer-id ]]
            [[ "$(cat "$evidence/desktop/quotabot-macos-desktop-draft-signing-mode.txt")" == developer-id ]]
            read -r cli_digest cli_name cli_extra \
              < "$evidence/cli/quotabot-macos-cli-draft-archive.sha256"
            read -r desktop_digest desktop_name desktop_extra \
              < "$evidence/desktop/quotabot-macos-desktop-draft-archive.sha256"
            [[ "$cli_digest" =~ ^[0-9a-f]{64}$ && \
               "$cli_name" == quotabot-darwin-arm64.tar.gz && -z "$cli_extra" ]]
            [[ "$desktop_digest" =~ ^[0-9a-f]{64}$ && \
               "$desktop_name" == quotabot-darwin-arm64-desktop.zip && \
               -z "$desktop_extra" ]]
            [[ "$(sha256sum "$destination/$cli_name" | awk '{print $1}')" == "$cli_digest" ]]
            [[ "$(sha256sum "$destination/$desktop_name" | awk '{print $1}')" == "$desktop_digest" ]]
          fi
          if [ "$WINDOWS_SIGNING_BACKEND" = azure-artifact-signing ]; then
            evidence="$RUNNER_TEMP/quotabot-final-windows-evidence"
            [[ "$(cat "$evidence/cli/quotabot-windows-cli-draft-signing-mode.txt")" == azure-artifact-signing ]]
            [[ "$(cat "$evidence/desktop/quotabot-windows-desktop-draft-signing-mode.txt")" == azure-artifact-signing ]]
            read -r cli_digest cli_name cli_extra \
              < "$evidence/cli/quotabot-windows-cli-draft-archive.sha256"
            read -r desktop_digest desktop_name desktop_extra \
              < "$evidence/desktop/quotabot-windows-desktop-draft-archive.sha256"
            [[ "$cli_digest" =~ ^[0-9a-f]{64}$ && \
               "$cli_name" == quotabot-windows-x64.zip && -z "$cli_extra" ]]
            [[ "$desktop_digest" =~ ^[0-9a-f]{64}$ && \
               "$desktop_name" == quotabot-windows-x64-desktop.zip && \
               -z "$desktop_extra" ]]
            [[ "$(sha256sum "$destination/$cli_name" | awk '{print $1}')" == "$cli_digest" ]]
            [[ "$(sha256sum "$destination/$desktop_name" | awk '{print $1}')" == "$desktop_digest" ]]
          fi
          python tools/verify_cli_archive.py \
            "$destination/quotabot-windows-x64.zip"
          python tools/verify_cli_archive.py \
            "$destination/quotabot-darwin-arm64.tar.gz"
          python tools/verify_cli_archive.py \
            "$destination/quotabot-linux-x64.tar.gz"
          python tools/verify_cli_archive.py \
            "$destination/quotabot-linux-arm64.tar.gz"
          python tools/verify_desktop_archive.py \
            "$destination/quotabot-windows-x64-desktop.zip"
          python tools/verify_desktop_archive.py \
            "$destination/quotabot-darwin-arm64-desktop.zip"
          python tools/verify_desktop_archive.py \
            "$destination/quotabot-linux-x64-desktop.tar.gz"

          source_digest="$(git rev-parse 'HEAD^{commit}')"
          for archive in "$destination"/*.zip "$destination"/*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$GITHUB_REF_NAME" \
              --source-digest "$source_digest" \
              --deny-self-hosted-runners
          done

  publish-release:
    # Runs only if every build leg succeeded, so the release is published only
    # after all platform assets are present. Prereleases do not replace latest.
    needs:
      - create-release
      - audit-release-assets
      - quality-gate
      - codeql-gate
      - secret-scan-gate
    if: >-
      ${{ always() &&
          needs.create-release.result == 'success' &&
          needs.audit-release-assets.result == 'success' &&
          needs.quality-gate.result == 'success' &&
          needs.codeql-gate.result == 'success' &&
          needs.secret-scan-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          EXPECTED_RELEASE_TITLE_SHA256: ${{ needs.create-release.outputs.release_title_sha256 }}
          EXPECTED_RELEASE_BODY_SHA256: ${{ needs.create-release.outputs.release_body_sha256 }}
          AUDITED_ASSET_MANIFEST_SHA256: ${{ needs.audit-release-assets.outputs.asset_manifest_sha256 }}
        run: |
          resolve_remote_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq '[.object.type, .object.sha] | @tsv')
            for _ in 1 2 3 4 5 6 7 8; do
              case "$object_type" in
                commit)
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  read -r object_type object_sha < <(gh api \
                    "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                    --jq '[.object.type, .object.sha] | @tsv')
                  ;;
                *)
                  echo "Release tag resolves to unsupported object type: $object_type" >&2
                  return 1
                  ;;
              esac
            done
            echo 'Release tag indirection is unexpectedly deep.' >&2
            return 1
          }

          remote_tag_commit="$(resolve_remote_tag_commit)"
          if [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
            echo 'Remote release tag no longer points to the workflow commit.' >&2
            exit 1
          fi
          main_commit="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/main" \
            --jq '.sha')"
          if [ "$GITHUB_SHA" != "$main_commit" ]; then
            echo 'The protected main tip changed before release publication.' >&2
            exit 1
          fi
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo 'Draft release id is invalid.' >&2; exit 1 ;;
          esac
          if [[ ! "$AUDITED_ASSET_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Audited asset manifest digest is invalid.' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_RELEASE_TITLE_SHA256" =~ ^[0-9a-f]{64}$ ]] || \
             [[ ! "$EXPECTED_RELEASE_BODY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Expected release metadata digest is invalid.' >&2
            exit 1
          fi
          expected_prerelease=false
          expected_make_latest=true
          case "$GITHUB_REF_NAME" in
            *-*) expected_prerelease=true; expected_make_latest=false ;;
          esac
          read -r release_tag is_draft is_prerelease < <(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '[.tag_name, .draft, .prerelease] | @tsv')
          if [ "$release_tag" != "$GITHUB_REF_NAME" ] || [ "$is_draft" != true ]; then
            echo 'The audited release object is missing, replaced, or no longer a draft.' >&2
            exit 1
          fi
          if [ "$is_prerelease" != "$expected_prerelease" ]; then
            echo 'The draft prerelease classification changed after creation.' >&2
            exit 1
          fi
          release_metadata="$RUNNER_TEMP/quotabot-final-release-metadata.json"
          release_title="$RUNNER_TEMP/quotabot-final-release-title.txt"
          release_body="$RUNNER_TEMP/quotabot-final-release-body.txt"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$release_metadata"
          jq -erj '.name | strings' "$release_metadata" > "$release_title"
          jq -erj '.body | strings' "$release_metadata" > "$release_body"
          release_title_sha256="$(sha256sum "$release_title" | awk '{print $1}')"
          release_body_sha256="$(sha256sum "$release_body" | awk '{print $1}')"
          if [ "$release_title_sha256" != "$EXPECTED_RELEASE_TITLE_SHA256" ]; then
            echo 'The draft release title changed after creation.' >&2
            exit 1
          fi
          if [ "$release_body_sha256" != "$EXPECTED_RELEASE_BODY_SHA256" ]; then
            echo 'The draft release body changed after creation.' >&2
            exit 1
          fi
          manifest="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq 'sort_by(.name) | .[] | [.id, .name, .size, .state, .updated_at] | @tsv')"
          manifest_sha256="$(printf '%s\n' "$manifest" | sha256sum | awk '{print $1}')"
          if [ "$manifest_sha256" != "$AUDITED_ASSET_MANIFEST_SHA256" ]; then
            echo 'The draft release asset set changed after final audit.' >&2
            exit 1
          fi
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="$expected_make_latest" >/dev/null
          read -r published_tag published_draft published_prerelease < <(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '[.tag_name, .draft, .prerelease] | @tsv')
          if [ "$published_tag" != "$GITHUB_REF_NAME" ] || \
             [ "$published_draft" != false ] || \
             [ "$published_prerelease" != "$expected_prerelease" ]; then
            echo 'Published release metadata does not match the audited draft.' >&2
            exit 1
          fi
          latest_tag="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')"
          if [ "$expected_make_latest" = true ] && \
             [ "$latest_tag" != "$GITHUB_REF_NAME" ]; then
            echo 'Stable release did not become GitHub Latest.' >&2
            exit 1
          fi
          if [ "$expected_make_latest" = false ] && \
             [ "$latest_tag" = "$GITHUB_REF_NAME" ]; then
            echo 'Prerelease unexpectedly replaced GitHub Latest.' >&2
            exit 1
          fi
