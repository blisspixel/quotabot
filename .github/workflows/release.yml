name: Release

# Cuts a GitHub release when a v* tag is pushed, building native CLI and desktop
# archives plus matching .sha256 sidecars. The release is created as a draft and
# published only after every platform asset has been validated, attested, and
# uploaded, so `releases/latest` never points at a partial release.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; jobs widen only what they need. Actions are
# pinned to commit SHAs (version in the trailing comment) so a repointed tag
# cannot inject a compromised action into the artifact build path. Dependabot
# reports available updates; selected pins are recreated and tested on a
# first-party branch.
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify the tagged commit is the current main tip
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse 'HEAD^{commit}')"
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if [ "$tagged_commit" != "$main_commit" ]; then
            echo 'Release tags must point to the current protected main tip.' >&2
            exit 1
          fi
      - name: Verify tag matches the source release version
        run: python tools/check_release_version.py --tag "$GITHUB_REF_NAME"
      - name: Validate explicit native signing modes
        env:
          WINDOWS_SIGNING_BACKEND: ${{ vars.QUOTABOT_WINDOWS_SIGNING_BACKEND }}
          MACOS_SIGNING_MODE: ${{ vars.QUOTABOT_MACOS_SIGNING_MODE }}
        run: |
          case "$WINDOWS_SIGNING_BACKEND" in
            unsigned|azure-artifact-signing) ;;
            *) echo 'QUOTABOT_WINDOWS_SIGNING_BACKEND must be unsigned or azure-artifact-signing.' >&2; exit 1 ;;
          esac
          case "$MACOS_SIGNING_MODE" in
            unsigned) ;;
            *) echo 'QUOTABOT_MACOS_SIGNING_MODE must be unsigned until the Developer ID path is enabled.' >&2; exit 1 ;;
          esac

  quality-gate:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  codeql-gate:
    needs: preflight
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  secret-scan-gate:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/gitleaks.yml

  create-release:
    needs:
      - preflight
      - quality-gate
      - codeql-gate
      - secret-scan-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.ensure_release.outputs.release_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Create the release as a draft if it does not exist
        id: ensure_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_SIGNING_BACKEND: ${{ vars.QUOTABOT_WINDOWS_SIGNING_BACKEND }}
          MACOS_SIGNING_MODE: ${{ vars.QUOTABOT_MACOS_SIGNING_MODE }}
        run: |
          resolve_remote_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq '[.object.type, .object.sha] | @tsv')
            for _ in 1 2 3 4 5 6 7 8; do
              case "$object_type" in
                commit)
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  read -r object_type object_sha < <(gh api \
                    "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                    --jq '[.object.type, .object.sha] | @tsv')
                  ;;
                *)
                  echo "Release tag resolves to unsupported object type: $object_type" >&2
                  return 1
                  ;;
              esac
            done
            echo 'Release tag indirection is unexpectedly deep.' >&2
            return 1
          }

          expected_prerelease=false
          prerelease_args=()
          case "$GITHUB_REF_NAME" in
            *-*) expected_prerelease=true; prerelease_args+=(--prerelease --latest=false) ;;
          esac
          if [ "$WINDOWS_SIGNING_BACKEND" = azure-artifact-signing ]; then
            windows_status='Windows: Azure Artifact Signing Public Trust with RFC 3161 SHA-256 timestamping.'
          else
            windows_status='Windows: unsigned transition artifact. SmartScreen publisher identity is not established.'
          fi
          macos_status='macOS: unsigned transition artifact. Developer ID and notarization are not established.'
          signing_note="Native signing status: $windows_status $macos_status Checksums and GitHub build provenance remain required. Do not bypass SmartScreen or Gatekeeper."
          release_version="${GITHUB_REF_NAME#v}"
          changelog_notes="$(awk -v version="$release_version" '
            index($0, "## " version " - ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$changelog_notes" ]; then
            echo "CHANGELOG.md has no release section for $release_version." >&2
            exit 1
          fi
          release_notes="$(printf '%s\n\n%s\n' "$signing_note" "$changelog_notes")"
          main_commit="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/main" \
            --jq '.sha')"
          if [ "$GITHUB_SHA" != "$main_commit" ]; then
            echo 'Releases must target the current protected main tip.' >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            read -r is_draft is_prerelease < <(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv')
            if [ "$is_draft" != true ]; then
              echo "Refusing to replace assets on published release $GITHUB_REF_NAME." >&2
              exit 1
            fi
            if [ "$is_prerelease" != "$expected_prerelease" ]; then
              echo "Draft prerelease classification does not match $GITHUB_REF_NAME." >&2
              exit 1
            fi
            release_body="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq '.body')"
            case "$release_body" in
              *"$signing_note"*) ;;
              *) echo 'Draft release native signing disclosure does not match the current mode.' >&2; exit 1 ;;
            esac
            remote_tag_commit="$(resolve_remote_tag_commit)"
            if [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
              echo 'Remote release tag no longer points to the workflow commit.' >&2
              exit 1
            fi
            echo "Resuming draft release $GITHUB_REF_NAME."
          else
            remote_tag_commit="$(resolve_remote_tag_commit)"
            if [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
              echo 'Remote release tag no longer points to the workflow commit.' >&2
              exit 1
            fi
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              "${prerelease_args[@]}" \
              --notes "$release_notes"
          fi
          release_id="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId \
            --jq '.databaseId')"
          case "$release_id" in
            ''|*[!0-9]*) echo 'Draft release id is invalid.' >&2; exit 1 ;;
          esac
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # macOS is Apple Silicon only: GitHub retired the Intel (macos-13)
        # runner, and Dart compiles for the host arch, so Intel Macs build from
        # source (install.sh says so). Re-add an Intel leg only if a hosted Intel
        # runner returns or we add a Rosetta x64 cross-build.
        include:
          - os: ubuntu-latest
            script: bash tools/package-cli.sh
            archive: release/quotabot-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            script: bash tools/package-cli.sh
            archive: release/quotabot-linux-arm64.tar.gz
          - os: macos-latest
            script: bash tools/package-cli.sh
            archive: release/quotabot-darwin-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # upload the asset to the release
      id-token: write # mint the provenance signing certificate
      attestations: write # record the attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'
      - name: Resolve collector dependencies
        working-directory: collector
        run: dart pub get --enforce-lockfile
      - name: Build and package the CLI asset
        run: ${{ matrix.script }}
      - name: Verify CLI archive shape and checksum
        run: python tools/verify_cli_archive.py "${{ matrix.archive }}"
      - name: Attest build provenance for the archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ matrix.archive }}
      - name: Upload the asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ matrix.archive }}" \
            "${{ matrix.archive }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build-windows-cli-unsigned:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'
      - name: Resolve collector dependencies
        working-directory: collector
        run: dart pub get --enforce-lockfile
      - name: Build and inventory the unsigned Windows CLI candidate
        shell: pwsh
        run: |
          ./tools/package-cli.ps1 -NoArchive
          $source = 'collector/build/quotabot_cli_release/bundle'
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-unsigned'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'unsigned-inventory.json'
          $catalog = Join-Path $stage 'signing-catalog.txt'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $source -Destination $candidate -Recurse
          $inventory = python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --json $candidate
          if ($LASTEXITCODE -ne 0) { throw "Unsigned native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          python tools/create_windows_signing_catalog.py --manifest $manifest --output $catalog --surface cli --architecture x64 $candidate
          if ($LASTEXITCODE -ne 0) { throw "Signing catalog creation failed with exit code $LASTEXITCODE" }
      - name: Preserve the immutable unsigned Windows CLI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-unsigned
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  sign-windows-cli:
    needs: build-windows-cli-unsigned
    if: vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
    runs-on: windows-latest
    environment: release-signing
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download the immutable unsigned Windows CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-signing
      - name: Validate the complete candidate and exact signing catalog
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-signing'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'unsigned-inventory.json'
          $catalog = Join-Path $stage 'signing-catalog.txt'
          $validatedCatalog = Join-Path $stage 'validated-signing-catalog.txt'
          python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --expect-manifest $manifest $candidate
          if ($LASTEXITCODE -ne 0) { throw "Unsigned candidate validation failed with exit code $LASTEXITCODE" }
          python tools/create_windows_signing_catalog.py --manifest $manifest --output $validatedCatalog --surface cli --architecture x64 $candidate
          if ($LASTEXITCODE -ne 0) { throw "Signing catalog validation failed with exit code $LASTEXITCODE" }
          $expectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $catalog).Hash
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $validatedCatalog).Hash
          if ($actualHash -ne $expectedHash) { throw 'Downloaded signing catalog does not match the validated candidate.' }
      - name: Authenticate the isolated signer to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.QUOTABOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.QUOTABOT_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.QUOTABOT_AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL
      - name: Sign the exact Windows CLI catalog with Azure Artifact Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.QUOTABOT_AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.QUOTABOT_AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.QUOTABOT_AZURE_CERTIFICATE_PROFILE }}
          files-catalog: ${{ runner.temp }}\quotabot-windows-cli-signing\validated-signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: false
          enhanced-key-usage: 1.3.6.1.5.5.7.3.3
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          timeout: 300
          batch-size: 0
          cache-dependencies: false
          trace: false
      - name: Verify the signed Windows CLI candidate
        shell: pwsh
        env:
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ vars.QUOTABOT_WINDOWS_SUBSCRIBER_EKU }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-signing'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'inventory.json'
          $receipt = Join-Path $stage 'signature-verification.json'
          $inventory = python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --json $candidate
          if ($LASTEXITCODE -ne 0) { throw "Post-signing native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          python tools/verify_windows_signatures.py --manifest $manifest --surface cli --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $candidate
          if ($LASTEXITCODE -ne 0) { throw "Windows signature verification failed with exit code $LASTEXITCODE" }
      - name: Preserve the immutable signed Windows CLI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cli-signed-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-signing
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  package-windows-cli:
    needs: [create-release, build-windows-cli-unsigned, sign-windows-cli]
    if: >-
      ${{ always() &&
          needs.create-release.result == 'success' &&
          needs.build-windows-cli-unsigned.result == 'success' &&
          ((vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'unsigned' &&
            needs.sign-windows-cli.result == 'skipped') ||
           (vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing' &&
            needs.sign-windows-cli.result == 'success')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download the signed Windows CLI candidate
        if: vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-cli-signed-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-package
      - name: Download the explicitly unsigned Windows CLI candidate
        if: vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'unsigned'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-cli-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-cli-package
      - name: Revalidate and package the selected Windows CLI candidate
        shell: pwsh
        env:
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ vars.QUOTABOT_WINDOWS_SUBSCRIBER_EKU }}
          WINDOWS_SIGNING_BACKEND: ${{ vars.QUOTABOT_WINDOWS_SIGNING_BACKEND }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-package'
          $candidate = Join-Path $stage 'candidate'
          $manifest = if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            Join-Path $stage 'inventory.json'
          } else {
            Join-Path $stage 'unsigned-inventory.json'
          }
          python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --expect-manifest $manifest $candidate
          if ($LASTEXITCODE -ne 0) { throw "Selected candidate validation failed with exit code $LASTEXITCODE" }
          if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            $receipt = Join-Path $stage 'packaging-signature-verification.json'
            python tools/verify_windows_signatures.py --manifest $manifest --surface cli --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $candidate
            if ($LASTEXITCODE -ne 0) { throw "Selected candidate signature verification failed with exit code $LASTEXITCODE" }
          }
          $destination = 'collector/build/quotabot_cli_release/bundle'
          New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
          if (Test-Path -LiteralPath $destination) { throw 'Package destination unexpectedly exists.' }
          Copy-Item -LiteralPath $candidate -Destination $destination -Recurse
          ./tools/package-cli.ps1 -PackageOnly
      - name: Verify the Windows CLI archive shape and checksum
        run: python tools/verify_cli_archive.py release/quotabot-windows-x64.zip
      - name: Bind the Windows CLI archive to its native inventory
        shell: pwsh
        env:
          WINDOWS_SIGNING_BACKEND: ${{ vars.QUOTABOT_WINDOWS_SIGNING_BACKEND }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-package'
          $manifest = if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            Join-Path $stage 'inventory.json'
          } else {
            Join-Path $stage 'unsigned-inventory.json'
          }
          $extract = Join-Path $env:RUNNER_TEMP "quotabot-windows-cli-$([Guid]::NewGuid().ToString('N'))"
          Expand-Archive -LiteralPath 'release/quotabot-windows-x64.zip' -DestinationPath $extract
          python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --expect-manifest $manifest $extract
          if ($LASTEXITCODE -ne 0) { throw "Packaged archive inventory mismatch with exit code $LASTEXITCODE" }
      - name: Preserve the Windows CLI signing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cli-native-signing-inventory
          path: |
            ${{ runner.temp }}/quotabot-windows-cli-package/*.json
            ${{ runner.temp }}/quotabot-windows-cli-package/*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Attest Windows CLI archive build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/quotabot-windows-x64.zip
      - name: Upload the Windows CLI asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/quotabot-windows-x64.zip \
            release/quotabot-windows-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  verify-cli-release:
    needs: [create-release, build, package-windows-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: quotabot-windows-x64.zip
          - os: macos-latest
            archive: quotabot-darwin-arm64.tar.gz
          - os: ubuntu-latest
            archive: quotabot-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            archive: quotabot-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QUOTABOT_DEMO: '1'
    permissions:
      # GitHub exposes draft releases only to push-capable identities. This job
      # performs reads only, but contents: write is required to see the draft.
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download the draft CLI asset and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo 'Draft release id is invalid.' >&2; exit 1 ;;
          esac
          destination="$RUNNER_TEMP/quotabot-cli-release"
          mkdir -p "$destination"
          for name in "${{ matrix.archive }}" "${{ matrix.archive }}.sha256"; do
            asset_id="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --paginate \
              --jq ".[] | select(.name == \"$name\") | .id")"
            case "$asset_id" in
              ''|*[!0-9]*) echo "Draft asset id is invalid for $name." >&2; exit 1 ;;
            esac
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$destination/$name"
          done
      - name: Reverify downloaded CLI archive and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive="$RUNNER_TEMP/quotabot-cli-release/${{ matrix.archive }}"
          python tools/verify_cli_archive.py "$archive"
          source_digest="$(git rev-parse 'HEAD^{commit}')"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --source-digest "$source_digest" \
            --deny-self-hosted-runners
      - name: Exercise the downloaded Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ vars.QUOTABOT_WINDOWS_SUBSCRIBER_EKU }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'quotabot-cli-release\${{ matrix.archive }}'
          $expanded = Join-Path $env:RUNNER_TEMP 'quotabot-cli-expanded'
          $manifest = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-draft-inventory.json'
          $receipt = Join-Path $env:RUNNER_TEMP 'quotabot-windows-cli-draft-signature-verification.json'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'quotabot-cli-state'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $inventory = python tools/native_code_inventory.py --platform windows --surface cli --architecture x64 --json $expanded
          if ($LASTEXITCODE -ne 0) { throw "Downloaded CLI native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          if ('${{ vars.QUOTABOT_WINDOWS_SIGNING_BACKEND }}' -eq 'azure-artifact-signing') {
            python tools/verify_windows_signatures.py --manifest $manifest --surface cli --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $expanded
            if ($LASTEXITCODE -ne 0) { throw "Downloaded CLI signature verification failed with exit code $LASTEXITCODE" }
          }
          $executable = Join-Path $expanded 'bin\quotabot.exe'
          $expectedVersion = 'quotabot ' + $env:GITHUB_REF_NAME.TrimStart('v')
          $actualVersion = & $executable --version
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne $expectedVersion) {
            throw "Expected $expectedVersion, got $actualVersion"
          }
          $doctor = & $executable doctor --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $doctor.schema -ne 'quotabot.v1') {
            throw 'Downloaded CLI doctor check failed.'
          }
      - name: Preserve downloaded Windows CLI signature evidence
        if: always() && runner.os == 'Windows' && vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cli-draft-signature-verification
          path: |
            ${{ runner.temp }}/quotabot-windows-cli-draft-inventory.json
            ${{ runner.temp }}/quotabot-windows-cli-draft-signature-verification.json
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise the downloaded macOS or Linux CLI
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          archive="$RUNNER_TEMP/quotabot-cli-release/${{ matrix.archive }}"
          expanded="$RUNNER_TEMP/quotabot-cli-expanded"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/quotabot-cli-state"
          mkdir -p "$expanded" "$XDG_CONFIG_HOME"
          tar -xzf "$archive" -C "$expanded"
          executable="$expanded/bin/quotabot"
          test -x "$executable"
          expected_version="quotabot ${GITHUB_REF_NAME#v}"
          actual_version="$("$executable" --version)"
          [[ "$actual_version" == "$expected_version" ]] || {
            echo "Expected $expected_version, got $actual_version" >&2
            exit 1
          }
          "$executable" doctor --json \
            | python -c 'import json, sys; assert json.load(sys.stdin)["schema"] == "quotabot.v1"'

  build-desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: bash tools/package-macos.sh
            archive: release/quotabot-darwin-arm64-desktop.zip
          - os: ubuntu-latest
            script: bash tools/package-linux.sh
            archive: release/quotabot-linux-x64-desktop.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up pinned Flutter SDK
        shell: pwsh
        run: >
          ./tools/setup-flutter-ci.ps1
          -FlutterVersion '3.44.6'
          -ExpectedCommit 'ee80f08bbf97172ec030b8751ceab557177a34a6'
      - name: Install Linux desktop build prerequisites
        if: runner.os == 'Linux'
        run: >
          bash tools/install-linux-desktop-prereqs.sh
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libayatana-appindicator3-dev dbus-x11 xvfb
      - name: Resolve desktop dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Build and package the desktop asset
        run: ${{ matrix.script }}
      - name: Verify archive shape and checksum
        run: python tools/verify_desktop_archive.py "${{ matrix.archive }}"
      - name: Attest desktop archive build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ matrix.archive }}
      - name: Upload the desktop asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ matrix.archive }}" \
            "${{ matrix.archive }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build-windows-desktop-unsigned:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up pinned Flutter SDK
        shell: pwsh
        run: >
          ./tools/setup-flutter-ci.ps1
          -FlutterVersion '3.44.6'
          -ExpectedCommit 'ee80f08bbf97172ec030b8751ceab557177a34a6'
      - name: Build and inventory the unsigned Windows desktop candidate
        shell: pwsh
        run: |
          ./tools/package-windows.ps1 -NoArchive
          $source = 'app/build/windows/x64/runner/Release'
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-unsigned'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'unsigned-inventory.json'
          $catalog = Join-Path $stage 'signing-catalog.txt'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $source -Destination $candidate -Recurse
          $inventory = python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --json $candidate
          if ($LASTEXITCODE -ne 0) { throw "Unsigned native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          python tools/create_windows_signing_catalog.py --manifest $manifest --output $catalog --surface desktop --architecture x64 $candidate
          if ($LASTEXITCODE -ne 0) { throw "Signing catalog creation failed with exit code $LASTEXITCODE" }
      - name: Preserve the immutable unsigned Windows desktop candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-unsigned
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  sign-windows-desktop:
    needs: build-windows-desktop-unsigned
    if: vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
    runs-on: windows-latest
    environment: release-signing
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download the immutable unsigned Windows desktop candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-signing
      - name: Validate the complete candidate and exact signing catalog
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-signing'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'unsigned-inventory.json'
          $catalog = Join-Path $stage 'signing-catalog.txt'
          $validatedCatalog = Join-Path $stage 'validated-signing-catalog.txt'
          python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --expect-manifest $manifest $candidate
          if ($LASTEXITCODE -ne 0) { throw "Unsigned candidate validation failed with exit code $LASTEXITCODE" }
          python tools/create_windows_signing_catalog.py --manifest $manifest --output $validatedCatalog --surface desktop --architecture x64 $candidate
          if ($LASTEXITCODE -ne 0) { throw "Signing catalog validation failed with exit code $LASTEXITCODE" }
          $expectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $catalog).Hash
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $validatedCatalog).Hash
          if ($actualHash -ne $expectedHash) { throw 'Downloaded signing catalog does not match the validated candidate.' }
      - name: Authenticate the isolated signer to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.QUOTABOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.QUOTABOT_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.QUOTABOT_AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL
      - name: Sign the exact Windows desktop catalog with Azure Artifact Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.QUOTABOT_AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.QUOTABOT_AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.QUOTABOT_AZURE_CERTIFICATE_PROFILE }}
          files-catalog: ${{ runner.temp }}\quotabot-windows-desktop-signing\validated-signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: false
          enhanced-key-usage: 1.3.6.1.5.5.7.3.3
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          timeout: 300
          batch-size: 0
          cache-dependencies: false
          trace: false
      - name: Verify the signed Windows desktop candidate
        shell: pwsh
        env:
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ vars.QUOTABOT_WINDOWS_SUBSCRIBER_EKU }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-signing'
          $candidate = Join-Path $stage 'candidate'
          $manifest = Join-Path $stage 'inventory.json'
          $receipt = Join-Path $stage 'signature-verification.json'
          $inventory = python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --json $candidate
          if ($LASTEXITCODE -ne 0) { throw "Post-signing native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          python tools/verify_windows_signatures.py --manifest $manifest --surface desktop --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $candidate
          if ($LASTEXITCODE -ne 0) { throw "Windows signature verification failed with exit code $LASTEXITCODE" }
      - name: Preserve the immutable signed Windows desktop candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-signed-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-signing
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  package-windows-desktop:
    needs: [create-release, build-windows-desktop-unsigned, sign-windows-desktop]
    if: >-
      ${{ always() &&
          needs.create-release.result == 'success' &&
          needs.build-windows-desktop-unsigned.result == 'success' &&
          ((vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'unsigned' &&
            needs.sign-windows-desktop.result == 'skipped') ||
           (vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing' &&
            needs.sign-windows-desktop.result == 'success')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download the signed Windows desktop candidate
        if: vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-desktop-signed-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-package
      - name: Download the explicitly unsigned Windows desktop candidate
        if: vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'unsigned'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-desktop-unsigned-candidate
          path: ${{ runner.temp }}/quotabot-windows-desktop-package
      - name: Revalidate and package the selected Windows desktop candidate
        shell: pwsh
        env:
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ vars.QUOTABOT_WINDOWS_SUBSCRIBER_EKU }}
          WINDOWS_SIGNING_BACKEND: ${{ vars.QUOTABOT_WINDOWS_SIGNING_BACKEND }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-package'
          $candidate = Join-Path $stage 'candidate'
          $manifest = if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            Join-Path $stage 'inventory.json'
          } else {
            Join-Path $stage 'unsigned-inventory.json'
          }
          python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --expect-manifest $manifest $candidate
          if ($LASTEXITCODE -ne 0) { throw "Selected candidate validation failed with exit code $LASTEXITCODE" }
          if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            $receipt = Join-Path $stage 'packaging-signature-verification.json'
            python tools/verify_windows_signatures.py --manifest $manifest --surface desktop --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $candidate
            if ($LASTEXITCODE -ne 0) { throw "Selected candidate signature verification failed with exit code $LASTEXITCODE" }
          }
          $destination = 'app/build/windows/x64/runner/Release'
          New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
          if (Test-Path -LiteralPath $destination) { throw 'Package destination unexpectedly exists.' }
          Copy-Item -LiteralPath $candidate -Destination $destination -Recurse
          ./tools/package-windows.ps1 -PackageOnly
      - name: Verify the Windows desktop archive shape and checksum
        run: python tools/verify_desktop_archive.py release/quotabot-windows-x64-desktop.zip
      - name: Bind the Windows desktop archive to its native inventory
        shell: pwsh
        env:
          WINDOWS_SIGNING_BACKEND: ${{ vars.QUOTABOT_WINDOWS_SIGNING_BACKEND }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-package'
          $manifest = if ($env:WINDOWS_SIGNING_BACKEND -eq 'azure-artifact-signing') {
            Join-Path $stage 'inventory.json'
          } else {
            Join-Path $stage 'unsigned-inventory.json'
          }
          $extract = Join-Path $env:RUNNER_TEMP "quotabot-windows-desktop-$([Guid]::NewGuid().ToString('N'))"
          Expand-Archive -LiteralPath 'release/quotabot-windows-x64-desktop.zip' -DestinationPath $extract
          python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --expect-manifest $manifest $extract
          if ($LASTEXITCODE -ne 0) { throw "Packaged archive inventory mismatch with exit code $LASTEXITCODE" }
      - name: Preserve the Windows desktop signing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-native-signing-inventory
          path: |
            ${{ runner.temp }}/quotabot-windows-desktop-package/*.json
            ${{ runner.temp }}/quotabot-windows-desktop-package/*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Attest Windows desktop archive build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/quotabot-windows-x64-desktop.zip
      - name: Upload the Windows desktop asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/quotabot-windows-x64-desktop.zip \
            release/quotabot-windows-x64-desktop.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  verify-desktop-release:
    needs: [create-release, build-desktop, package-windows-desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: quotabot-windows-x64-desktop.zip
          - os: macos-latest
            archive: quotabot-darwin-arm64-desktop.zip
          - os: ubuntu-latest
            archive: quotabot-linux-x64-desktop.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      # GitHub exposes draft releases only to push-capable identities. This job
      # performs reads only, but contents: write is required to see the draft.
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download the draft desktop asset and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo 'Draft release id is invalid.' >&2; exit 1 ;;
          esac
          destination="$RUNNER_TEMP/quotabot-release"
          mkdir -p "$destination"
          for name in "${{ matrix.archive }}" "${{ matrix.archive }}.sha256"; do
            asset_id="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --paginate \
              --jq ".[] | select(.name == \"$name\") | .id")"
            case "$asset_id" in
              ''|*[!0-9]*) echo "Draft asset id is invalid for $name." >&2; exit 1 ;;
            esac
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$destination/$name"
          done
      - name: Reverify downloaded archive shape and checksum
        shell: bash
        run: python tools/verify_desktop_archive.py "$RUNNER_TEMP/quotabot-release/${{ matrix.archive }}"
      - name: Verify downloaded archive provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source_digest="$(git rev-parse 'HEAD^{commit}')"
          gh attestation verify "$RUNNER_TEMP/quotabot-release/${{ matrix.archive }}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --source-digest "$source_digest" \
            --deny-self-hosted-runners
      - name: Verify downloaded Windows desktop signatures
        if: runner.os == 'Windows' && vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
        shell: pwsh
        env:
          QUOTABOT_WINDOWS_SUBSCRIBER_EKU: ${{ vars.QUOTABOT_WINDOWS_SUBSCRIBER_EKU }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'quotabot-release\${{ matrix.archive }}'
          $expanded = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-draft-expanded'
          $manifest = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-draft-inventory.json'
          $receipt = Join-Path $env:RUNNER_TEMP 'quotabot-windows-desktop-draft-signature-verification.json'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $inventory = python tools/native_code_inventory.py --platform windows --surface desktop --architecture x64 --json $expanded
          if ($LASTEXITCODE -ne 0) { throw "Downloaded desktop native inventory failed with exit code $LASTEXITCODE" }
          Set-Content -LiteralPath $manifest -Value $inventory -Encoding utf8NoBOM -NoNewline
          python tools/verify_windows_signatures.py --manifest $manifest --surface desktop --architecture x64 --expected-subscriber-eku $env:QUOTABOT_WINDOWS_SUBSCRIBER_EKU --receipt $receipt $expanded
          if ($LASTEXITCODE -ne 0) { throw "Downloaded desktop signature verification failed with exit code $LASTEXITCODE" }
      - name: Preserve downloaded Windows desktop signature evidence
        if: always() && runner.os == 'Windows' && vars.QUOTABOT_WINDOWS_SIGNING_BACKEND == 'azure-artifact-signing'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-draft-signature-verification
          path: |
            ${{ runner.temp }}/quotabot-windows-desktop-draft-inventory.json
            ${{ runner.temp }}/quotabot-windows-desktop-draft-signature-verification.json
          if-no-files-found: warn
          retention-days: 14
      - name: Download and verify the previous stable desktop asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resolve_tag_commit() {
            local tag="$1"
            local object_type object_sha
            read -r object_type object_sha < <(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '[.object.type, .object.sha] | @tsv')
            for _ in 1 2 3 4 5 6 7 8; do
              case "$object_type" in
                commit)
                  [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  read -r object_type object_sha < <(gh api \
                    "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                    --jq '[.object.type, .object.sha] | @tsv')
                  ;;
                *) return 1 ;;
              esac
            done
            return 1
          }

          previous_tag="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')"
          if [[ ! "$previous_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Previous stable release tag is invalid.' >&2
            exit 1
          fi
          if [ "$previous_tag" = "$GITHUB_REF_NAME" ]; then
            echo 'Previous stable release must differ from the candidate.' >&2
            exit 1
          fi
          previous_digest="$(resolve_tag_commit "$previous_tag")" || {
            echo 'Previous stable release tag does not resolve to one commit.' >&2
            exit 1
          }
          destination="$RUNNER_TEMP/quotabot-previous-release"
          mkdir -p "$destination"
          gh release download "$previous_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ matrix.archive }}" \
            --pattern "${{ matrix.archive }}.sha256" \
            --dir "$destination"
          printf '%s' "$previous_tag" > "$destination/tag"
          python tools/verify_desktop_archive.py \
            "$destination/${{ matrix.archive }}"
          gh attestation verify "$destination/${{ matrix.archive }}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$previous_tag" \
            --source-digest "$previous_digest" \
            --deny-self-hosted-runners
      - name: Install Linux desktop runtime prerequisites
        if: runner.os == 'Linux'
        run: >
          bash tools/install-linux-desktop-prereqs.sh
          libgtk-3-dev libayatana-appindicator3-dev dbus-x11 xvfb
      - name: Exercise the Windows portable lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'quotabot-release\${{ matrix.archive }}'
          $previousArchive = Join-Path $env:RUNNER_TEMP 'quotabot-previous-release\${{ matrix.archive }}'
          $current = Join-Path $env:RUNNER_TEMP 'quotabot-desktop-current'
          $previous = Join-Path $env:RUNNER_TEMP 'quotabot-desktop-previous'
          $config = Join-Path $env:RUNNER_TEMP 'quotabot-config'
          $sentinel = Join-Path $config 'quotabot\manual\release-sentinel'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $sentinel) | Out-Null
          New-Item -ItemType File -Force -Path $sentinel | Out-Null
          $env:LOCALAPPDATA = $config

          Expand-Archive -LiteralPath $previousArchive -DestinationPath $previous
          Expand-Archive -LiteralPath $archive -DestinationPath $current
          $readinessReport = Join-Path $env:RUNNER_TEMP 'quotabot-windows-current-readiness.json'
          $previousReadinessReport = Join-Path $env:RUNNER_TEMP 'quotabot-windows-previous-readiness.json'
          python tools/desktop_readiness_smoke.py `
            --executable (Join-Path $current 'quotabot.exe') `
            --report $readinessReport
          if ($LASTEXITCODE -ne 0) { throw 'Current desktop archive did not start.' }
          python tools/desktop_readiness_smoke.py `
            --executable (Join-Path $previous 'quotabot.exe') `
            --report $previousReadinessReport
          if ($LASTEXITCODE -ne 0) { throw 'Desktop rollback archive did not start.' }

          function Remove-PortableTree {
            param([Parameter(Mandatory = $true)][string]$LiteralPath)

            for ($attempt = 1; $attempt -le 10; $attempt++) {
              try {
                Remove-Item -LiteralPath $LiteralPath -Recurse -Force -ErrorAction Stop
                return
              } catch {
                if ($attempt -eq 10) { throw }
                Start-Sleep -Milliseconds 1000
              }
            }
          }

          Remove-PortableTree -LiteralPath $current
          Remove-PortableTree -LiteralPath $previous
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw 'Portable uninstall removed the persistent-state sentinel.'
          }
      - name: Exercise the Linux portable lifecycle
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          archive="$RUNNER_TEMP/quotabot-release/${{ matrix.archive }}"
          previous_archive="$RUNNER_TEMP/quotabot-previous-release/${{ matrix.archive }}"
          current="$RUNNER_TEMP/quotabot-desktop-current"
          previous="$RUNNER_TEMP/quotabot-desktop-previous"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/quotabot-config"
          sentinel="$XDG_CONFIG_HOME/quotabot/manual/release-sentinel"
          mkdir -p "$(dirname "$sentinel")" "$current" "$previous"
          : > "$sentinel"

          tar -xzf "$previous_archive" -C "$previous"
          tar -xzf "$archive" -C "$current"
          python tools/desktop_readiness_smoke.py \
            --executable "$current/quotabot" \
            --report "$RUNNER_TEMP/quotabot-linux-current-readiness.json"
          python tools/desktop_readiness_smoke.py \
            --executable "$previous/quotabot" \
            --report "$RUNNER_TEMP/quotabot-linux-previous-readiness.json"

          rm -rf "$current" "$previous"
          test -f "$sentinel"
      - name: Preserve portable desktop readiness evidence
        if: always() && (runner.os == 'Windows' || runner.os == 'Linux')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-readiness-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/quotabot-*-readiness.json
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise the macOS portable lifecycle
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          archive="$RUNNER_TEMP/quotabot-release/${{ matrix.archive }}"
          previous_archive="$RUNNER_TEMP/quotabot-previous-release/${{ matrix.archive }}"
          current="$RUNNER_TEMP/quotabot-desktop-current"
          previous="$RUNNER_TEMP/quotabot-desktop-previous"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/quotabot-config"
          sentinel="$XDG_CONFIG_HOME/quotabot/manual/release-sentinel"
          mkdir -p "$(dirname "$sentinel")" "$current" "$previous"
          : > "$sentinel"

          ditto -x -k "$previous_archive" "$previous"
          ditto -x -k "$archive" "$current"
          for bundle in "$current/quotabot.app" "$previous/quotabot.app"; do
            test -x "$bundle/Contents/MacOS/quotabot"
            plutil -lint "$bundle/Contents/Info.plist"
          done

          rm -rf "$current" "$previous"
          test -f "$sentinel"

  audit-release-assets:
    needs: [create-release, verify-cli-release, verify-desktop-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Draft asset listings require a push-capable token.
      contents: write
      attestations: read
    outputs:
      asset_manifest_sha256: ${{ steps.asset_manifest.outputs.asset_manifest_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Require the exact complete release asset set
        id: asset_manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo 'Draft release id is invalid.' >&2; exit 1 ;;
          esac
          expected="$(printf '%s\n' \
            quotabot-darwin-arm64-desktop.zip \
            quotabot-darwin-arm64-desktop.zip.sha256 \
            quotabot-darwin-arm64.tar.gz \
            quotabot-darwin-arm64.tar.gz.sha256 \
            quotabot-linux-arm64.tar.gz \
            quotabot-linux-arm64.tar.gz.sha256 \
            quotabot-linux-x64-desktop.tar.gz \
            quotabot-linux-x64-desktop.tar.gz.sha256 \
            quotabot-linux-x64.tar.gz \
            quotabot-linux-x64.tar.gz.sha256 \
            quotabot-windows-x64-desktop.zip \
            quotabot-windows-x64-desktop.zip.sha256 \
            quotabot-windows-x64.zip \
            quotabot-windows-x64.zip.sha256 | sort)"
          actual="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --paginate \
            --jq '.[].name' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Draft release asset set is incomplete or unexpected.' >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          invalid="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --paginate \
            --jq '.[] | select(.state != "uploaded") | .name')"
          if [ -n "$invalid" ]; then
            echo "Draft release has assets that are not uploaded: $invalid" >&2
            exit 1
          fi
          manifest="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq 'sort_by(.name) | .[] | [.id, .name, .size, .state, .updated_at] | @tsv')"
          manifest_sha256="$(printf '%s\n' "$manifest" | sha256sum | awk '{print $1}')"
          echo "asset_manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
      - name: Reverify every final archive, checksum, and attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          destination="$RUNNER_TEMP/quotabot-final-assets"
          mkdir -p "$destination"
          names="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --paginate \
            --jq '.[].name')"
          while IFS= read -r name; do
            asset_id="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --paginate \
              --jq ".[] | select(.name == \"$name\") | .id")"
            case "$asset_id" in
              ''|*[!0-9]*) echo "Draft asset id is invalid for $name." >&2; exit 1 ;;
            esac
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$destination/$name"
          done <<< "$names"

          (cd "$destination" && sha256sum --check ./*.sha256)
          python tools/verify_cli_archive.py \
            "$destination/quotabot-windows-x64.zip"
          python tools/verify_cli_archive.py \
            "$destination/quotabot-darwin-arm64.tar.gz"
          python tools/verify_cli_archive.py \
            "$destination/quotabot-linux-x64.tar.gz"
          python tools/verify_cli_archive.py \
            "$destination/quotabot-linux-arm64.tar.gz"
          python tools/verify_desktop_archive.py \
            "$destination/quotabot-windows-x64-desktop.zip"
          python tools/verify_desktop_archive.py \
            "$destination/quotabot-darwin-arm64-desktop.zip"
          python tools/verify_desktop_archive.py \
            "$destination/quotabot-linux-x64-desktop.tar.gz"

          source_digest="$(git rev-parse 'HEAD^{commit}')"
          for archive in "$destination"/*.zip "$destination"/*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$GITHUB_REF_NAME" \
              --source-digest "$source_digest" \
              --deny-self-hosted-runners
          done

  publish-release:
    # Runs only if every build leg succeeded, so the release is published only
    # after all platform assets are present. Prereleases do not replace latest.
    needs:
      - create-release
      - audit-release-assets
      - quality-gate
      - codeql-gate
      - secret-scan-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          AUDITED_ASSET_MANIFEST_SHA256: ${{ needs.audit-release-assets.outputs.asset_manifest_sha256 }}
        run: |
          resolve_remote_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq '[.object.type, .object.sha] | @tsv')
            for _ in 1 2 3 4 5 6 7 8; do
              case "$object_type" in
                commit)
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  read -r object_type object_sha < <(gh api \
                    "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                    --jq '[.object.type, .object.sha] | @tsv')
                  ;;
                *)
                  echo "Release tag resolves to unsupported object type: $object_type" >&2
                  return 1
                  ;;
              esac
            done
            echo 'Release tag indirection is unexpectedly deep.' >&2
            return 1
          }

          remote_tag_commit="$(resolve_remote_tag_commit)"
          if [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
            echo 'Remote release tag no longer points to the workflow commit.' >&2
            exit 1
          fi
          main_commit="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/main" \
            --jq '.sha')"
          if [ "$GITHUB_SHA" != "$main_commit" ]; then
            echo 'The protected main tip changed before release publication.' >&2
            exit 1
          fi
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo 'Draft release id is invalid.' >&2; exit 1 ;;
          esac
          if [[ ! "$AUDITED_ASSET_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Audited asset manifest digest is invalid.' >&2
            exit 1
          fi
          expected_prerelease=false
          case "$GITHUB_REF_NAME" in
            *-*) expected_prerelease=true ;;
          esac
          read -r release_tag is_draft is_prerelease < <(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '[.tag_name, .draft, .prerelease] | @tsv')
          if [ "$release_tag" != "$GITHUB_REF_NAME" ] || [ "$is_draft" != true ]; then
            echo 'The audited release object is missing, replaced, or no longer a draft.' >&2
            exit 1
          fi
          if [ "$is_prerelease" != "$expected_prerelease" ]; then
            echo 'The draft prerelease classification changed after creation.' >&2
            exit 1
          fi
          manifest="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq 'sort_by(.name) | .[] | [.id, .name, .size, .state, .updated_at] | @tsv')"
          manifest_sha256="$(printf '%s\n' "$manifest" | sha256sum | awk '{print $1}')"
          if [ "$manifest_sha256" != "$AUDITED_ASSET_MANIFEST_SHA256" ]; then
            echo 'The draft release asset set changed after final audit.' >&2
            exit 1
          fi
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false >/dev/null
